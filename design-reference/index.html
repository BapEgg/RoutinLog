function field(label,value,key,type='text',hint=''){
 const val=S[key]!==undefined?S[key]:value;
 const numeric=type==='number'?' step="any" inputmode="decimal" min="0"':'';
 return `<label class="field"><span>${label}</span>${type==='textarea'?`<textarea data-key="${key}" placeholder="${attr(hint)}">${escapeHtml(val)}</textarea>`:`<input data-key="${key}" aria-label="${attr(label)}" type="${type}" ${type!=='file'?`value="${attr(val)}"`:''}${numeric}${type==='file'?' accept="image/*"':''}>`}${hint&&type!=='textarea'?`<small>${hint}</small>`:''}</label>`;

function selectField(label,options,key,value){return `<label class="field"><span>${label}</span><select data-key="${key}">${options.map(x=>`<option ${x===(S[key]??value)?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></label>`;}

function macroRings(values){const targets=[S.carbTarget,S.proteinTarget,S.fatTarget];return `<div class="tri section">${['탄수화물','단백질','지방'].map((n,i)=>`<div class="ring-stat"><div class="ring" style="background:conic-gradient(#666 ${Math.min(values[i]/targets[i]*100,100)}%,#e5e5e5 0);border:0"><div style="border-radius:50%;width:58px;height:58px;background:white;display:grid;place-items:center;font-size:14px">${values[i]}<span style="font-size:9px;font-weight:400">g</span></div></div>${n}<small>목표 ${targets[i]} g</small></div>`).join('')}</div>`;}

/* Layout prototype policy, not a validated production recommendation engine.
   Mifflin REE is published; PAL mapping, goal multipliers and rounding below
   are explicit product-policy candidates. Waist and future available days
   are deliberately excluded from the energy calculation. */
function estimateStartTargets(p){
 const age=+p.age,weight=+p.weight,height=+p.height;
 if(![age,weight,height].every(Number.isFinite)||age<18||weight<=0||height<=0)return {ok:false,reason:'자동 시작값은 기본 신체 정보가 있는 성인 기준이에요. 정보를 확인하거나 목표 없이 먼저 기록할 수 있어요.'};
 if(!['남성','여성'].includes(p.sex))return {ok:false,reason:'선택한 공식에 필요한 성별 계수가 비어 있어요. 기본 정보를 보완하거나 목표 없이 먼저 기록할 수 있어요.'};
 const ree=10*weight+6.25*height-5*age+(p.sex==='남성'?5:-161);
 const days=Number.parseInt(p.currentExerciseDays,10)||0;
 const duration={'30분 미만':20,'30–60분':45,'60분 이상':60,'잘 모르겠어요':0}[p.currentExerciseDuration]||0;
 const intensity={'가벼움 · 대화가 편함':0.8,'보통 · 숨이 조금 참':1,'높음 · 대화가 어려움':1.2,'잘 모르겠어요':1}[p.currentExerciseIntensity]||1;
 const exerciseScore=days*duration*intensity;
 const exerciseTier=exerciseScore>=240?2:exerciseScore>=90?1:0;
 const matrix={'앉아 있는 편':[1.3,1.45,1.6],'이동이 잦은 편':[1.45,1.6,1.75],'몸을 많이 쓰는 편':[1.6,1.75,1.9]};
 const pal=(matrix[p.activity]||matrix['앉아 있는 편'])[exerciseTier];
 const maintenance=ree*pal;
 const goalFactor={'근육 유지':1,'근육 증가':1.05,'체중 감량':0.9}[p.goal]||1;
 const kcal=Math.round(maintenance*goalFactor/50)*50;
 const training=days>0&&p.currentExerciseType!=='잘 모르겠어요';
 const strength=(training&&['근력 중심','근력 + 유산소'].includes(p.currentExerciseType))||['근육 유지','근육 증가'].includes(p.goal);
 const proteinPerKg=strength?1.6:training?1.4:0.8;
 const protein=Math.round(weight*proteinPerKg/5)*5;
 const fat=Math.round(kcal*0.25/9);
 const carbs=Math.round((kcal-protein*4-fat*9)/4);
 const fiber=p.sex==='남성'?(age<=50?38:30):(age<=50?25:21);
 if(ree<=0||kcal<=0||carbs<0||protein*4>kcal*0.35)return {ok:false,reason:'현재 조합에서는 일반 시작값을 바로 제안하기 어려워요. 기본 정보를 다시 확인하거나 목표 없이 먼저 기록해주세요.'};
 return {ok:true,ree:Math.round(ree),maintenance:Math.round(maintenance/50)*50,pal,goalFactor,proteinPerKg,days,duration,strength,activityUncertain:p.currentExerciseDays==='잘 모르겠어요'||(days>0&&(duration===0||p.currentExerciseIntensity==='잘 모르겠어요')),policyVersion:'prototype-start-0.1',targets:{kcalTarget:kcal,carbTarget:carbs,proteinTarget:protein,fatTarget:fat,fiberTarget:fiber}};
}

 if(!e.ok)return `<div class="card"><h3>먼저 기본 정보를 확인해요.</h3><p class="small tight">${e.reason}</p>${B('기본 정보 보완','A04','full tight')}${B('목표 없이 기록부터 시작','A08','ghost full')}</div>`;

 <details><summary>어떤 정보를 반영했나요?</summary>${kv('목적',S.goal)}${kv('신체',S.units==='imperial'?`${S.age}세 · ${S.ft} ft ${S.inch} in · ${toLb(S.weight)} lb`:`${S.age}세 · ${S.height} cm · ${Number(S.weight).toFixed(1)} kg`)}${kv('생활 활동',S.activity)}${kv('최근 실제 운동',`${S.currentExerciseDays} · ${S.currentExerciseType}`)}${kv('1회 시간 · 강도',`${S.currentExerciseDuration} · ${S.currentExerciseIntensity.split(' · ')[0]}`)}<p class="small">허리둘레는 변화 비교용이에요. 앞으로 운동 가능한 날을 이미 수행한 운동량으로 더하지 않았어요. 단백질은 현재 운동 또는 근육 유지·증가 목적의 근력운동을 고려한 시작안이에요.</p></details>
 <details><summary>계산 기준과 추정의 한계</summary><div class="calculation-steps"><strong>1. 휴식 에너지 · Mifflin–St Jeor</strong><p><code>10 × 체중kg + 6.25 × 키cm − 5 × 나이 + 성별 계수</code><br>남성 +5 · 여성 −161</p>${kv('휴식 에너지 추정',`${e.ree.toLocaleString()} kcal`)}<strong>2. 활동과 목적 · 시안 정책</strong>${kv('생활 + 실제 운동 활동계수',String(e.pal))}${kv('유지 에너지 추정',`약 ${e.maintenance.toLocaleString()} kcal`)}${kv('목적별 조정',`${S.goal} · × ${e.goalFactor}`)}<p>휴식 에너지 × 활동계수 × 목적 계수, 마지막에 50 kcal 단위로 반올림해요. 활동계수는 1.3–1.9 범위의 시안 구간표예요. 유지 ×1.0 · 증가 ×1.05 · 감량 ×0.9를 사용해요.</p><strong>3. 영양 배분 · 시안 정책</strong>${kv('단백질 시작 기준',`${e.proteinPerKg} g / 체중kg`)}${kv('지방 시작 기준','총 목표 열량의 25%')}<p>단백질과 지방을 배분한 나머지가 탄수화물이에요. 비율은 탄수화물·단백질 4 kcal/g, 지방 9 kcal/g으로 계산해요. g 단위 반올림으로 합계 열량에 작은 차이가 생길 수 있어요.</p></div><p class="small">공개된 휴식 에너지 공식과 앱의 시작 정책을 구분해요. 활동 구간·목적별 조정폭·영양 배분은 검토 중인 시안 정책이며 개인에게 검증된 처방값은 아니에요. 걸음·운동 칼로리를 활동계수에 다시 더하지 않아요.</p><a class="source" href="https://pubmed.ncbi.nlm.nih.gov/2305711/" target="_blank" rel="noopener">Mifflin–St Jeor 원문 · 1990 ↗</a></details>
 ${e.activityUncertain?note('운동량이 불확실해 현재 확인된 활동을 기준으로 시작했어요. 실제 운동 기록이 쌓이면 다시 확인해요.'):''}`;

'<div class="form-error" role="alert"></div>',{back:'A06',subtitle:'6 / 7 · 시작 기준',footer:()=>(S.targetMode==='manual'||estimateStartTargets(S).ok)?X(S.targetMode==='estimate'?'이 시작 목표로 기록하기':'입력한 목표로 시작','targets','','primary full')+B('기본 정보 다시 보기','A04','ghost full'):''});

screen('F09','영양성분표 촬영','촬영 영역 → 앨범 선택 → 인식 안내 → 읽기','사진 선택 → OCR 추출 대기 → 확인 화면. 재촬영 가능.','이미지 파일과 추출값을 분리하고 확인 전 식품 DB에 저장하지 않는다. 시안은 샘플 라벨로 확인 화면을 보여주며 실제 카메라·OCR는 연결하지 않았다.',()=>`
<div class="placeholder" style="min-height:290px"><div>┌　영양정보 영역　┐<br><br>기준량과 영양값이<br>잘 보이도록 맞춰주세요.<br><br>└　　　　　　　　┘</div></div><div class="cols section">${X('사진 촬영','ocr','','full')}${X('앨범에서 선택','ocr','','full')}</div>${note('글씨가 흐리거나 표가 잘리면 다시 찍어주세요. 추출된 값은 저장 전에 확인할 수 있어요.')}`,{back:'F08',footer:()=>B('샘플 라벨 읽기','F10','primary full')});

screen('F10','읽은 내용 확인','추출된 제품명·기준량 → 불확실 항목 → 원본 → 저장','확실한 값 확인, 모호한 값 수정 또는 정보 없음 → 저장.','필수 식별·기준량 오류를 검증한다. 모호한 값은 확인 플래그로 보존하고, 미기재 영양값은 0으로 채우지 않는다.',()=>`
${note('6개 항목을 읽었어요. 표시된 항목을 확인해주세요.')}${field('제품명','샘플 단백질 제품','ocrName')}${field('기준량 · g','80','ocrServing','number')}${field('열량 · kcal','160','ocrKcal','number')}<div class="card"><div class="row"><strong>단백질</strong>${pill('확인 필요')}</div>${field('원본과 비교 · g','20','ocrProtein','number')}</div>${field('탄수화물 · g','4','ocrCarbs','number')}${field('지방 · g','7','ocrFat','number')}<div class="row"><span>식이섬유</span>${pill('정보 없음')}</div><details><summary>원본 사진 확대</summary><div class="placeholder">영양성분표 원본 이미지 영역<br>샘플 시안 · 실제 첨부 이미지 없음</div></details><div class="form-error" role="alert"></div>`,{back:'F09',footer:()=>X('확인한 정보로 저장','ocr-save','','primary full')+B('다시 촬영','F09','ghost full')});

screen('F11','상품 URL 등록','상품 주소 → 추출 과정 설명 → 분석','주소 입력 → 추출 → 사용자 확인. 접근 실패 → 이유와 대안.','서버가 페이지 접근·정상 영양표 여부를 검사한다. 접근 실패를 정보 0으로 취급하지 않는다. 임의 외부 사이트로 요청하지 않는 모의 화면이다.',()=>`
${field('상품 페이지 주소',S.productUrl||'https://shop.example/product/123','productUrl','url')}${note('상품 상세에 영양성분표가 있으면 항목을 읽어와요. 로그인이나 이미지 제한으로 읽지 못할 수도 있어요.')}<div class="card"><strong>저장하기 전에</strong><ul class="body-list"><li>제품과 기준량 확인</li><li>추출된 영양값 검토</li><li>확인한 정보만 저장</li></ul></div>${B('사진으로 등록하기','F09','ghost full')}`,{back:'F08',footer:()=>B('URL 정보 확인 · 실패 예시','F12','primary full')+B('추출 성공 예시 보기','F10','ghost full')});

<div class="empty-symbol">!</div><h3 class="state-title">이 페이지는<br>접근이 제한되어 있어요.</h3><p class="small">로그인이나 사이트 접근 제한 때문에 영양성분표를 읽지 못했어요.</p><div class="card section"><strong>영양성분표 사진이 있나요?</strong><p class="small tight">사진으로 등록한 후 추출값을 확인할 수 있어요.</p>${B('사진으로 등록','F09','primary full tight')}</div>${B('직접 입력','F13','full')}${B('이름만 먼저 기록','F16','ghost full')}`,{back:'F11',footer:()=>B('주소 수정 · 다시 시도','F11','full')});

screen('F13','식품 직접 등록','브랜드·이름 → 원본 기준량 → 영양값 → 선택 사진','기준량·영양표 그대로 입력 → 저장. 값 없는 항목은 비워두기.','0 입력과 빈 칸을 분리한다. 기준량은 양수로 검증하고 제품 단위 변환값은 명시한 경우만 허용한다. 실제 제품 사진은 선택이다.',()=>`
${field('브랜드 (선택)',S.manualBrand||'','manualBrand')}${field('음식 · 제품명',S.manualName||'','manualName')}<div class="cols">${field('기준량 · g',S.manualServing||'100','manualServing','number')}${selectField('상태',['제품 표기','조리 전','조리 후'],'foodState','제품 표기')}</div><div class="cols">${field('열량 · kcal','','manualKcal','number')}${field('단백질 · g','','manualProtein','number')}${field('탄수화물 · g','','manualCarbs','number')}${field('지방 · g','','manualFat','number')}</div>${field('식이섬유 · g (모르면 비우기)','','manualFiber','number')}${field('대표 사진 (선택)','','foodPhoto','file')}<div class="form-error" role="alert"></div>`,{back:'F08',footer:()=>X('식품 저장','manual-save','','primary full')});

screen('F14','저장 식사·레시피 편집','식사 이름 → 재료와 조리 상태 → 완성량·먹은 분량 → 기본 끼니','재료 추가/양 변경 → 레시피 전체 합계 → 1회 섭취량 지정.','건면 200 g과 삶은 면 200 g을 분리한다. 총 조리량 또는 총 인분에 따른 비율을 적용한다. 개·스푼 변환은 사용자 확인한 g이 있을 때만 계산한다.',()=>`

screen('F15','식사 기록 저장','실제 섭취 구성 → 저장 범위 → 적용 날짜 → 완료','오늘만 기록 / 기본 식단도 수정 중 선택 → 저장.','실제 섭취 로그와 템플릿 수정은 별도 저장한다. 오늘 실제 기록은 원래 계획 스냅샷을 보존한다. 템플릿 변경은 선택한 미래 날짜부터 적용한다.',()=>`
<div class="card"><div class="kicker">9월 23일 · 점심</div><strong>${S.actualMealName||'기본 점심'}</strong>${kv('기록할 양',S.qtyEdited?`${S.qty} g으로 수정한 음식 포함`:'확인한 음식 · 양')}${kv('기록 상태','실제 먹음')}</div><div class="section-title">어디에 반영할까요?</div>${choices('mealScope',[['today','오늘 기록만 변경'],['future','오늘 기록 + 기본 식단 변경']],true)}${S.mealScope==='future'?field('기본 식단 적용 시작일','2026-09-24','mealApplyDate','date'):note('내일 이후의 기본 식단은 그대로예요.')}
${section('변경 사유 (선택)',chips('foodReason',['재료 없음','외식','시간 부족','선호','생략']))}`,{back:'F03',footer:()=>X('식사 기록 완료','meal-save','','primary full')});

screen('W01','일주일 운동','주간 범위 → 요일별 루틴·유산소·휴식 → 루틴 설정','오늘 시작 / 요일 이동 / 기본 루틴 편집 / 프로그램 탐색.','반복 템플릿에서 날짜별 계획을 생성한다. 근력·유산소·휴식은 동시에 고려하고 이미 완료한 기록은 일정 이동으로 복제하지 않는다.',()=>`
<div class="row"><strong>9.21 — 9.27</strong>${pill('상하체 · 직접 설정')}</div><div class="card section">${weekPlan()}</div><div class="cols">${B('내 루틴 편집','W04')}${B('프로그램 찾기','W02')}</div>${note('오늘 일정이 달라졌다면 이번 주만 옮길 수 있어요. 기본 반복 일정은 그대로 둘 수 있어요.')}${B('워밍업 · 스트레칭 설정','W17','ghost full')}`,{tab:'운동',footer:()=>B('오늘 하체 A 시작','W08','primary full')});

screen('W02','프로그램 둘러보기','목적 필터 → 가능한 요일·장소 → 프로그램 목록 → 직접 만들기','목적별 5개, 총 15개 템플릿 탐색 → 상세 → 내 일정에 맞추기.','연구가 지지하는 원칙을 바탕으로 구성한 서비스 초안이다. 15개 프로그램 전체가 각각 임상시험으로 검증되었다고 표현하지 않는다. 유명 제작자의 프로그램은 출처 소개로 구분한다.',()=>`
${segments('programGoal',[['M','근육 유지'],['G','근육 증가'],['W','체중 감량']])}<div class="row"><small>내 일정 ${S.days.length}일 · 헬스장</small>${B('조건 변경','A06','tiny')}</div><div class="section">${RL.programs.filter(p=>p.id[0]===S.programGoal).map(p=>`<button class="option" data-act="program" data-value="${p.id}"><div class="fill"><strong>${p.name}</strong><small>${p.frequency} · ${p.context}</small></div><span>›</span></button>`).join('')}</div><p class="footnote">검토한 운동 원칙으로 구성한 루틴로그 템플릿이에요. 구체적인 조합과 진행 규칙은 서비스 설계안이에요.</p>`,{back:'W01',footer:()=>B('내 루틴 직접 만들기','W04','full')});

screen('W03','프로그램 상세','목적·대상 → 주간 일정 → 운동 구성 → 장점·부담 → 근거','구성을 확인하고 내 요일·기구·수준에 맞게 편집한 뒤 사용.','선택한 프로그램 ID·버전·원칙 근거를 저장한다. 진행 조건과 사용자 수정 이력을 함께 보존한다. 공개 소개 자료와 앱 템플릿을 혼동하지 않는다.',()=>{
const p=RL.programs.find(x=>x.id===S.program)||RL.programs.find(x=>x.id==='G02');return `<div class="kicker">${p.id} · 루틴로그 템플릿</div><h3 class="hero">${p.name}</h3><p class="small">${p.context}</p><div class="card section">${kv('목적',p.goal)}${kv('근력 빈도',p.frequency)}${kv('참고 근거',p.evidence)}</div><div class="section-title">일정 · 진행 방식</div><div class="card"><ul class="body-list">${p.details.slice(0,5).map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ul></div><details><summary>구체적인 운동 구성 펼치기</summary>${p.details.slice(5).map(t=>`<p class="small">${escapeHtml(t)}</p>`).join('')}${programExercises(p.id)}</details><div class="card section"><strong>부담과 변경 가능 범위</strong><p class="small tight">선택한 요일·기구·소요 시간을 확인해요. 최근 수행과 난도가 충분히 확인되기 전에는 중량을 자동으로 늘리지 않아요.</p></div>${B('원칙의 근거 보기','R08','ghost full')}<details><summary>선수·코치의 공개 프로그램 참고</summary>공식 소개를 참고할 수 있어요. 아래 제작자가 이 앱의 템플릿을 추천했다는 뜻은 아니에요.<a class="source" href="https://www.jimwendler.com/blogs/jimwendler-com/5-3-1-for-beginners" target="_blank" rel="noopener">Jim Wendler · 5/3/1 for Beginners ↗</a><a class="source" href="https://jeffnippard.com/products/the-essentials-program" target="_blank" rel="noopener">Jeff Nippard · Essentials 공개 소개 ↗</a></details>`;},{back:'W02',footer:()=>B('내 일정에 맞춰 사용','W04','primary full')});

screen('W04','내 루틴 편집','이름·요일 → 종목 순서 → 계획 세트·횟수·휴식 → 진행 규칙','운동 추가, 삭제·순서 변경, 세트 계획 입력 → 기본 주간 배치.','계획과 실제를 분리한다. 새 프로그램 적용일 이전 기록은 유지한다. 진행 규칙이 없는 사용자 루틴에 임의 증량 규칙을 붙이지 않는다.',()=>`
${field('루틴 이름',S.routineName||'하체 A','routineName')}<div class="card">${routineEditRows()}</div><div class="cols">${B('+ 운동 추가','W05')}${X('순서 바꾸기','reorder','','')}</div>${selectField('주간 배치',['화·금','월·목','수·토','매주 직접 배치'],'routineDays','화·금')}${selectField('진행 방식',['내가 직접 조절','반복 범위 내 진행','프로그램 규칙 사용'],'progression','내가 직접 조절')}<details><summary>세트 표기 · 기구 기준</summary>준비 세트와 본 세트 분리. 덤벨은 한쪽/합계, 스미스는 바 포함/원판만을 운동별로 선택해요.</details>`,{back:'W01',footer:()=>X('기본 루틴 저장','save-go','W01','primary full')});

screen('W05','운동 추가','검색 → 부위·기구 필터 → 종목 이름·그림 대체 → 직접 등록','운동 선택 → 운동법·기록 기준 확인 → 계획에 추가.','시각 자료 없는 운동도 이름·기구·동작 분류로 식별 가능해야 한다. 운동 DB의 주요·보조 관여 부위와 사용자의 의도 부위를 분리한다.',()=>`
${field('운동 이름',S.exerciseQuery||'','exerciseQuery','search')}${chips('exerciseFilter',['전체','하체','상체','맨몸'])}<div data-exercise-results>${exerciseResults()}</div>${note('기구가 같아도 운동 변형은 따로 기록해요. 찾는 운동이 없으면 직접 등록할 수 있어요.')}`,{back:'W04',footer:()=>B('+ 내 운동 직접 등록','W07','full')});

screen('W06','운동법·내 기록','종목·기구 → 동작 이미지 자리 → 핵심 포인트 → 내 기록','검토된 동작 설명 확인 / 내 기록 확인 / 운동에 추가.','자체 작성 핵심 포인트와 검수된 이미지·영상만 제공한다. 시안의 이미지 자리는 콘텐츠 배치용이며 동작을 판독·진단하지 않는다.',()=>`
<div class="row start">${thumb('머신','exercise')}<div><h3>${S.exerciseName||'시티드 레그컬'}</h3><small>머신 · 주요: 햄스트링</small></div></div><div class="cols section"><div class="placeholder">시작 자세<br>검수 이미지 자리</div><div class="placeholder">수축 자세<br>검수 이미지 자리</div></div><details><summary>운동 영상 · 콘텐츠 상태</summary>검수한 영상의 재생 영역이에요. 이 시안에는 실제 영상이 연결되어 있지 않아요.</details><div class="card section"><strong>핵심 포인트</strong><ol class="body-list"><li>기구에 맞게 좌석과 패드를 조절해요.</li><li>몸통을 안정적으로 두고 움직여요.</li><li>무게를 제어하며 시작 위치로 돌아와요.</li>개인별 가동 범위와 기구 설명을 확인해요.</ol></div><div class="card">${kv('최근 내 기록','35 kg × 12회 · 3세트')}${kv('중량 표기','기구 표시 중량')}${B('최근 세트 기록 보기','W09','ghost full')}</div>`,{back:'W05',footer:()=>X('이 운동 추가','exercise-add','','primary full')});

screen('W07','내 운동 등록','운동명 → 기구 → 주요·보조 부위 → 단위·사진','이름과 기록 기준 설정. 부위가 불명확하면 미확인으로 저장.','사진은 선택이다. 사용자 분류와 검토된 DB 분류를 구분하며 미확인 운동을 AI가 특정 근육에 확정 배정하지 않는다.',()=>`
${field('운동 이름','','customExercise')}${selectField('기구',['머신','덤벨','바벨','밴드','맨몸','기타'],'equipment','머신')}${selectField('주요 부위',['미확인','대퇴사두','햄스트링','둔근','가슴','등','어깨','팔'],'primaryMuscle','미확인')}${field('보조 부위 (선택)','','secondaryMuscle')}${selectField('기록 방식',['중량 × 반복','반복만','시간','거리 + 시간'],'recordType','중량 × 반복')}${selectField('중량 기준',['기구 표시 중량','덤벨 한쪽','양쪽 합계','바 포함','원판만'],'weightConvention','기구 표시 중량')}${field('대표 사진 (선택)','','exercisePhoto','file')}<div class="form-error" role="alert"></div>`,{back:'W05',footer:()=>X('내 운동 저장','custom-exercise','','primary full')});

screen('W08','오늘 하체 A','워밍업 상태 → 종목 진행 목록 → 당일 변경 → 이어하기','완료·진행·예정 종목을 구분. 종목 선택 → 세트 기록. 변경 → 대체/이동.','완료한 세트만 실제로 저장한다. 계획대로 완료는 실제 수행값 복사를 확인해야 한다. 중단 시 일부 수행을 보존한다.',()=>`
<div class="card row"><div><strong>워밍업 · 스트레칭</strong><small class="small"> · 4동작</small></div>${B('확인','W17','tiny')}</div><div class="card">${workoutRows()}</div><div class="cols">${B('종목 교체','W11')}${B('오늘 일정 변경','W14')}</div><div class="card section"><small>이번 주 변경</small><p class="small tight">스미스 스쿼트 → 레그프레스<br>기구 대기 · 원래 목적: 대퇴사두</p>${B('변경 전후 보기','W12','ghost full')}</div>${B('+ 유산소 기록','W15','full')}${B('운동 마치기 · 일부만 완료','W16','ghost full')}`,{back:'W01',subtitle:'2 / 5종목 · 22분 경과',footer:()=>B('시티드 레그컬 이어하기','W09','primary full')});

screen('W09','세트 기록','종목·지난 기록 → 중량·횟수 큰 입력 → 세트 표 → 완료','계획·직전값 참고 → 현재 세트만 수정 → 완료 → 휴식.','세트마다 실제 종목·중량·횟수·종류·시각 저장. 현재 값을 다른 세트에 자동 전파하지 않는다. 기구·중량 표기가 다르면 직접 비교하지 않는다.',()=>`
<div class="row start">${thumb('머신','exercise')}<div><strong>시티드 레그컬</strong><small class="small"> · 기구 표시 중량</small></div>${B('운동법','W06','tiny')}</div><div class="card section">${kv('오늘 계획','3세트 · 35 kg × 12회')}${kv('최근 수행','35 kg × 12, 12, 10회')}</div><div class="card"><div class="stat-label">현재 세트 중량 · kg</div>${stepper('setWeight',S.setWeight,'kg',2.5)}<div class="tagrow">${X('− 2.5','adjust-weight','-2.5','tiny')}${X('+ 2.5','adjust-weight','2.5','tiny')}</div></div><div class="card"><div class="stat-label">횟수</div>${stepper('setReps',S.setReps,'회',1)}</div>${table(['세트','계획','실제'],[['1','35 × 12','35 × 12 ✓'],['2','35 × 12',S.setDone?`${S.setWeight} × ${S.setReps} ✓`:'입력 중'],['3','35 × 12','예정']])}<div class="cols section">${B('불편함 · 메모','W13')}${X('이 세트 생략','skip-set','','')}</div><div class="form-error" role="alert"></div>`,{back:'W08',subtitle:'본 세트 · 2 / 3',footer:()=>X('2세트 완료','set-done','','primary full')});

screen('W10','세트 사이 휴식','큰 휴식 시간 → 시간 조정 → 방금 완료값 → 다음 세트','+30초 / 건너뛰기 / 방금 기록 수정 → 다음 세트.','실제 앱은 종료 시각 기준 타이머로 복원한다. 이 시안은 애니메이션 없이 정적 시간과 조작만 제공한다. 휴식 시간을 회복 완료로 해석하지 않는다.',()=>`
<div class="timer"><small>남은 휴식</small><div class="clock">${timeText(S.rest)}</div><p class="small">설정 90초 · 화면 배치용 정지 타이머</p></div><div class="cols">${X('+30초','rest-add','','')}${B('휴식 건너뛰기','W09')}</div><div class="card section"><small>방금 기록 · 2세트</small><div class="row tight"><strong>${S.setWeight} kg × ${S.setReps}회 ✓</strong>${B('수정','W09','tiny')}</div></div><div class="card"><small>다음 · 3세트</small><p class="tight">계획 35 kg × 12회</p></div>`,{back:'W08',subtitle:'시티드 레그컬',footer:()=>B('다음 세트 시작','W09','primary full')});

screen('W11','대체 운동 찾기','원래 목적·기구 → 가능한 후보 → 비슷함·차이 → 선택','기구 대기 등 사유 선택 → 후보 또는 다른 부위 직접 선택 → 비교.','주요·보조 부위와 실제 가능한 기구로 후보를 제한한다. 비슷한 부위라도 중량·세트를 동등 자극량으로 환산하지 않는다.',()=>`
<div class="card"><small>바꾸려던 운동</small><p><strong>스미스 머신 스쿼트</strong></p><small>내 목적: 대퇴사두 · 100 kg × 10회 × 3</small></div>${section('변경 이유 (선택)',chips('workoutReason',['기구 대기','버거움','시간 부족','불편함','기타']))}${choices('substitute',[['레그프레스','주요 목적이 겹침 · 사용 가능한 머신'],['프리 스쿼트','주요 목적이 겹침 · 다른 숙련·부하 조건'],['리버스 런지','관여 부위 일부 겹침 · 좌우 기록 필요']])}${B('다른 부위 · 직접 검색','W05','ghost full')}`,{back:'W08',footer:()=>B('변경 전후 확인','W12','primary full')});

screen('W12','운동 교체 확인','원래 운동 → 새 운동 → 부위 차이 → 새 계획값·범위','새 운동의 이전 기록 참고 / 없으면 직접 입력 → 오늘만 또는 기본 루틴.','원래 계획과 대체 연결을 보존한다. 기구 간 kg는 환산하지 않는다. 대상 부위가 다를 경우 주간 전체에서 관찰하며 부족 세트를 자동 추가하지 않는다.',()=>`
<div class="card"><div class="kicker">원래 계획</div><strong>스미스 머신 스쿼트</strong><p class="small">대퇴사두 목적 · 100 kg × 10회 × 3</p><div class="divider"></div><div class="kicker">대체</div><strong>${S.substitute}</strong><p class="small">관련 부위가 겹쳐요 · 기구와 부하 조건은 달라요</p></div><div class="note">이 운동의 최근 기록을 참고해요.<br>스미스의 100 kg을 그대로 환산하지 않아요.</div><div class="cols">${field('계획 중량 · kg','120','subWeight','number')}${field('반복수','12','subReps','number')}</div>${field('세트','3','subSets','number')}${choices('workoutScope',[['today','오늘만 교체'],['future','기본 루틴에도 반영']],true)}`,{back:'W11',footer:()=>X('이 운동으로 교체','substitute-save','','primary full')});

screen('W13','불편함·수행 메모','종목 연결 → 부위·정도 → 수행 난도 → 메모','필요한 항목만 선택. 불편함으로 중단한 경우 실제 수행은 보존.','부위·정도·원문을 종목·날짜와 연결한다. 반복 패턴을 보되 통증 원인·정확한 회복률을 진단하지 않는다. 단순 난도를 RIR 숫자로 변환하지 않는다.',()=>`
<div class="card"><small>이 기록과 연결</small><p><strong>시티드 레그컬 · 2세트</strong></p></div>${field('불편한 부위 (선택)','','discomfortPart','text','예: 오른쪽 무릎 앞쪽')}${section('불편한 정도',chips('discomfort',['없음','조금','동작을 바꿈','중단함']))}${section('마지막 세트 난도',chips('difficulty',['여유','적당','버거움']))}<details><summary>RIR 직접 기록 (선택)</summary>${field('추가로 가능했을 반복수','','rir','number')}</details>${field('신경 쓸 점 · 메모','','workoutMemo','textarea')}`,{back:'W09',footer:()=>X('메모 저장','save-go','W09','primary full')});

screen('W14','운동 일정 옮기기','이동할 루틴 → 날짜 → 겹치는 일정 → 반영 범위','가능한 날짜 선택 → 기존 일정 확인 → 이번 주만/기본 변경.','한 루틴을 이동하고 중복 생성하지 않는다. 같은 부위의 연속 일정만으로 차단하지 않는다. 이미 수행한 부분과 아직 하지 않은 계획을 분리한다.',()=>`
<div class="card"><small>옮길 운동</small><p><strong>목요일 · 하체 A</strong></p><small>아직 시작하지 않은 세션</small></div>${field('옮길 날짜','2026-09-25','moveDate','date')}<div class="card"><strong>금요일에는 상체 B가 있어요.</strong><p class="small tight">한 날에 두 세션이 배치돼요. 소요 시간과 최근 피로를 확인해주세요.</p><div class="cols tight">${X('서로 맞바꾸기','move-kind','swap','')}${X('같은 날 배치','move-kind','same','')}</div></div>${choices('moveScope',[['week','이번 주만'],['future','기본 반복 일정도 변경']],true)}${note('세션을 놓쳤다고 다음 날 세트를 합쳐서 강제하지 않아요.')}`,{back:'W01',footer:()=>X('일정 변경 저장','move-save','','primary full')});

screen('W15','유산소 기록','종목·방식 → 계획 대비 시간 → 거리·난도 → 저장','연속 운동 / 인터벌 중 선택. 실제 수행한 시간만 입력.','근력 세션과 구분해 기록한다. 걸음에 포함된 걷기를 소비 열량에 중복 더하지 않는다. 타바타 명칭만으로 특정 연구 효과를 주장하지 않는다.',()=>`

screen('R08','이 제안의 근거','나의 기록 → 해석 → 사용 근거 → 적용 한계 → 원문','내 데이터와 연구가 어떻게 연결되는지 확인. 원문은 외부 열기.','연구의 대상·설계·한계·버전을 저장한다. 기록상 연관성과 확정 원인을 구분한다. 원칙의 근거와 구체적인 메뉴·운동 조합의 직접 검증을 구분한다.',()=>`
<div class="card"><div class="kicker">01 · 내 기록</div><strong>점심 2끼 변경 · 시간/재료 문제</strong><p class="small tight">단백질 목표 대비 −140 g/주. 기록된 영양값이 완전한 항목을 기준으로 비교했어요.</p></div><div class="card"><div class="kicker">02 · 제안에 연결한 해석</div><p class="small">목표를 바꾸기보다 준비하기 쉬운 선택지를 추가하면 실천 장벽을 줄일 수 있어요. 효과는 다음 기록에서 확인해야 해요.</p></div><div class="card"><div class="kicker">03 · 참고 자료</div><strong>총단백질 섭취와 저항운동</strong><p class="small tight">Morton 등, 2018 · 49개 연구 종합<br>운동 중 단백질 섭취를 검토하는 원칙 참고</p><a class="source" href="https://pubmed.ncbi.nlm.nih.gov/28698222/" target="_blank" rel="noopener">연구 원문 정보 ↗</a><strong>계획 이탈 후 습관 재개</strong><p class="small tight">NIDDK · 행동 설계 참고 자료<br>개별 메뉴 효과를 검증한 시험은 아니에요.</p><a class="source" href="https://www.niddk.nih.gov/health-information/diet-nutrition/changing-habits-better-health" target="_blank" rel="noopener">공식 안내 ↗</a></div><div class="note">850 kcal 메뉴와 개인별 적정량이 이 연구로 직접 검증된 것은 아니에요. 구체적인 구성은 내 목표·저장 식사·제약을 반영한 초안이에요.</div><details><summary>운동 원칙 참고 자료</summary><a class="source" href="https://pubmed.ncbi.nlm.nih.gov/41843416/" target="_blank" rel="noopener">ACSM 2026 · 성인 저항운동 지침 ↗</a>목표에 맞는 점진적 운동 원칙 참고. 프로그램 전체나 개인의 정확한 회복 시간을 보장하지 않아요.</details>`,{back:'R05',subtitle:'자료 검토 2026.09 · 시안'});

screen('R09','지난 리포트·내 선택','주차 목록 → 당시 제안 → 적용·수정·보류 → 후속 기록','이전 리포트 열기 / 진행 중 변경 추적.','채택 여부와 이후 실제 실행을 분리한다. 제안 버전·수정값·이유·적용일·후속 결과를 연결한다. 기록의 시간적 변화만으로 효과를 확정하지 않는다.',()=>`

screen('S05','알림 설정','주간 리포트 → 기록 알림 → 시간 → 운영체제 권한','필요한 알림만 선택. 알림 거절 시 앱 안에서 확인.','앱 내부 설정과 운영체제 알림 권한을 구분한다. 사용자 시간대 기준으로 예약한다. 과장된 실패·죄책감 문구 없이 기록 재개를 돕는다.',()=>`

function targetComposition(t){
 const nutrients=[['탄수화물',t.carbTarget,4,'carb'],['단백질',t.proteinTarget,4,'protein'],['지방',t.fatTarget,9,'fat']];
 const total=nutrients.reduce((sum,n)=>sum+n[1]*n[2],0);
 const percentages=nutrients.map(n=>n[1]*n[2]/total*100);
 const rounded=percentages.map(Math.floor);let remainder=100-rounded.reduce((s,n)=>s+n,0);
 percentages.map((n,i)=>({i,fraction:n-rounded[i]})).sort((a,b)=>b.fraction-a.fraction).slice(0,remainder).forEach(n=>rounded[n.i]++);
 return `<div class="target-composition section"><div class="row"><span class="target-eyebrow">하루 시작 목표</span><span class="target-status">${icon('Check')} 자동 제안</span></div><div class="target-total">약 <strong>${t.kcalTarget.toLocaleString()}</strong><span>kcal</span></div><p>이 열량을 탄수화물 · 단백질 · 지방으로 나눠요.</p><div class="composition-bar" role="img" aria-label="목표 열량 구성: ${nutrients.map((n,i)=>`${n[0]} ${rounded[i]}퍼센트`).join(', ')}">${nutrients.map((n,i)=>`<span class="macro-${n[3]}" style="width:${percentages[i]}%"></span>`).join('')}</div><div class="composition-legend">${nutrients.map((n,i)=>`<div><span><i class="macro-${n[3]}"></i>${n[0]}</span><strong>${n[1]}<small>g</small></strong><small>열량의 ${rounded[i]}%</small></div>`).join('')}</div><div class="composition-caption">목표의 구성 비율 · 아직 먹은 양이 아니에요</div></div>`;
}
function nutritionProgress(values,kcal){
 const targets=[S.carbTarget,S.proteinTarget,S.fatTarget];
 return `<div class="daily-kcal-track" aria-hidden="true"><span style="width:${Math.min(kcal/S.kcalTarget*100,100)}%"></span></div><div class="nutrition-progress">${['탄수화물','단백질','지방'].map((n,i)=>`<div class="intake-row"><div class="row"><span>${n}</span><span><strong>${values[i]}</strong> / ${targets[i]} g</span></div><div class="intake-track" role="progressbar" aria-label="${n} 섭취, ${values[i]}g / 목표 ${targets[i]}g" aria-valuemin="0" aria-valuemax="${targets[i]}" aria-valuenow="${Math.min(values[i],targets[i])}"><span class="macro-${['carb','protein','fat'][i]}" style="width:${Math.min(values[i]/targets[i]*100,100)}%"></span></div></div>`).join('')}</div>`;
}

function conditionSummary(){

const PROGRAM_DAYS=['월','화','수','목','금','토','일'];
const programGoalCode=goal=>goal==='체중 감량'?'W':goal==='근육 증가'?'G':'M';
function programPickDays(days,count){
 const pool=PROGRAM_DAYS.filter(d=>(days||[]).includes(d));if(pool.length<=count)return pool;
 let best=[],bestScore=-Infinity;
 const choose=(start,picked)=>{if(picked.length===count){const idx=picked.map(d=>PROGRAM_DAYS.indexOf(d));const gaps=idx.map((n,i)=>(idx[(i+1)%idx.length]-n+7)%7||7);const score=Math.min(...gaps)*100-gaps.reduce((a,n)=>a+n*n,0);if(score>bestScore){bestScore=score;best=picked;}return;}for(let i=start;i<pool.length;i++)choose(i+1,[...picked,pool[i]]);};
 choose(0,[]);return best;
}
function buildProgramDraft(program,profile={}){
 if(!program||!Array.isArray(program.sessions))return {ok:false,reason:'프로그램을 먼저 선택해주세요.'};
 const days=PROGRAM_DAYS.filter(d=>(profile.days||[]).includes(d));
 if(!days.length)return {ok:false,reason:'운동 가능한 요일을 하나 이상 선택해주세요.'};
 const goal=profile.goal||'유지',beginner=!['꾸준히 운동 중','중급','고급'].includes(profile.experience);
 const short=/30분 미만|20분|짧게/.test(profile.sessionTime||'');
 const selectedDays=programPickDays(days,program.maxDays);
 const sets=(!beginner&&!short&&goal==='근육 증가')?3:2;
 const effort=beginner?'자세를 유지하며 3~4회 정도 여유':'자세를 유지하며 2~3회 정도 여유';
 const notices=[];
 if(days.length<program.minDays)notices.push(`기본 ${program.minDays}회 중 ${days.length}회만 배치했어요. 이번 주 조정안이며, 더 적은 횟수의 프로그램도 비교할 수 있어요.`);
 if(short)notices.push('짧은 시간에 맞춰 세션마다 우선 3종목을 배치했어요. 전체 구성을 확인하고 필요한 종목을 바꿔주세요.');
 if(beginner)notices.push('첫 주에는 중량을 정해주지 않아요. 동작을 익히며 여유 있게 할 수 있는 무게를 기록해주세요.');
 const consecutive=selectedDays.some(d=>selectedDays.includes(PROGRAM_DAYS[(PROGRAM_DAYS.indexOf(d)+1)%7]));
 if(consecutive)notices.push('연속 운동일이 있어요. 전날 운동과 오늘의 피로·불편함을 확인하고 필요하면 일정을 옮겨요.');
 const sessions=selectedDays.map((day,index)=>{
  const source=program.sessions[index%program.sessions.length];
  return {id:`${program.id}-${index+1}`,day,name:source.name,effort,exercises:source.exercises.slice(0,short?3:source.exercises.length).map(([name,target,reps])=>({name,target,reps,sets,load:'',loadNote:'최근 기록 또는 첫 수행 후 입력'})),cardioMinutes:program.cardio?10:0,cardioKind:program.cardio?'걷기 또는 실내 자전거':''};
 });
 if(program.cardio)notices.push('유산소는 각 근력일 10분의 가벼운 시작 초안이에요. 최근 실제 수행이 있다면 그 시간과 체감 난도로 수정해요. 공통 권장량을 채웠다는 뜻은 아니에요.');
 return {ok:true,programId:program.id,version:program.version,name:program.name,goal,profile:{days:[...days],experience:profile.experience||'입문',sessionTime:profile.sessionTime||'30–60분'},sessions,notices,startingSets:sets,createdFrom:'onboarding-and-template',status:'draft'};
}

function programHandleAction(actionName,value,container){
 if(actionName==='select'){S.program=value;go('W03');return;}
 if(actionName==='custom'){S.programEditing=false;go('W04');return;}
 if(actionName==='create'){
  const result=buildProgramDraft(programSelected(),S);if(!result.ok){message(result.reason);go('A06');return;}
  S.programDraft=result;S.programEditing=true;S.programEditSession=0;go('W04');return;
 }
 if(actionName==='edit-active'){S.programDraft=JSON.parse(JSON.stringify(S.activeProgramDraft));S.programDraft.status='draft';S.programEditing=true;go('W04');return;}
 if(actionName==='compare'){S.programEditing=false;go('W02');return;}
 if(actionName==='hold'){S.programHeld=true;S.programEditing=false;go('W01');message('초안을 보류했어요. 적용 중인 계획은 유지해요.');return;}
 if(actionName==='apply'){
  const d=S.programDraft;if(!d||!d.sessions.length)return error(container,'확인할 주간 계획이 없어요.');
  const duplicate=new Set(d.sessions.map(s=>s.day)).size!==d.sessions.length;
  if(duplicate)return error(container,'같은 요일에 두 세션이 있어요. 이 초안에서는 서로 다른 요일로 배치해주세요.');
  if(d.sessions.some(s=>s.exercises.some(ex=>!Number.isInteger(+ex.sets)||+ex.sets<1||+ex.sets>8||!ex.reps.trim())||!Number.isFinite(+s.cardioMinutes)||+s.cardioMinutes<0||+s.cardioMinutes>180))return error(container,'본 세트는 1~8의 정수, 반복·시간은 빈칸 없이, 유산소는 0~180분으로 확인해주세요.');
  S.activeProgramDraft=JSON.parse(JSON.stringify({...d,status:'applied',effectiveDate:'2026-09-28'}));S.programHeld=false;S.programEditing=false;go('W01');message('다음 주 계획에 적용했어요. 이전 실제 기록은 유지돼요.');
 }
}
if(typeof document!=='undefined'){
 document.addEventListener('click',e=>{const button=e.target.closest('[data-program-action]');if(!button)return;e.preventDefault();e.stopImmediatePropagation();programHandleAction(button.dataset.programAction,button.dataset.value,button.closest('.phone'));},true);
 document.addEventListener('input',e=>{const el=e.target,key=el.dataset.programField;if(!key||!S.programDraft)return;const session=S.programDraft.sessions[+el.dataset.session];if(!session)return;if(el.dataset.exercise!==undefined){const ex=session.exercises[+el.dataset.exercise];if(ex)ex[key]=el.value;}else session[key]=el.value;},true);

/* Energy estimates are separate from the nutrition target. No target mutation occurs here. */
const CARDIO_POLICY_VERSION='cardio-mvp-2026-09-25.1';
const CARDIO_MET_PRESETS=[
 {id:'bike50',label:'실내 자전거 · 50 W',met:4,code:'01214',activity:'실내 자전거',source:'https://pacompendium.com/bicycling/'},
 {id:'bike100',label:'실내 자전거 · 90–100 W',met:6,code:'01220',activity:'실내 자전거',source:'https://pacompendium.com/bicycling/'},
 {id:'bike150',label:'실내 자전거 · 126–150 W',met:8,code:'01228',activity:'실내 자전거',source:'https://pacompendium.com/bicycling/'},
 {id:'bikeLeisure',label:'야외 자전거 · 16 km/h 미만 여가 주행',met:4,code:'01010',activity:'야외 자전거',source:'https://pacompendium.com/bicycling/'},
 {id:'walkSelf',label:'실내 트랙·야외 걷기 · 스스로 정한 속도',met:4,code:'17255',activity:'걷기',source:'https://pacompendium.com/walking/'}
];
function cardioNumber(value){if(value===null||value===undefined||String(value).trim()==='')return NaN;return Number(value);}
function cardioRounded(value){return Number.isFinite(value)?Math.round(value/10)*10:null;}
function estimateCardioWalking(weightKg,segments){
 const weight=cardioNumber(weightKg);
 if(!Number.isFinite(weight)||weight<=0)return {ok:false,reason:'체중을 0보다 큰 값으로 입력해주세요.'};
 if(!Array.isArray(segments)||!segments.length)return {ok:false,reason:'실제로 걸은 구간을 입력해주세요.'};
 let grossKcal=0,activeKcal=0,durationMinutes=0;const inputs=[];
 for(let i=0;i<segments.length;i++){
  const speed=cardioNumber(segments[i].speedKmh),grade=cardioNumber(segments[i].gradePercent),minutes=cardioNumber(segments[i].minutes);
  if(!Number.isFinite(speed)||speed<3.2||speed>5.6)return {ok:false,reason:`${i+1}구간: 보행식은 3.2–5.6 km/h 걷기에 사용해요. 달리기·범위 밖 속도는 기기값이나 시간만 기록을 선택해주세요.`};
  if(!Number.isFinite(grade)||grade<0||grade>15)return {ok:false,reason:`${i+1}구간: 이 시안은 경사 0–15%의 걷기만 계산해요. 내리막·더 큰 경사는 시간만 기록할 수 있어요.`};
  if(!Number.isFinite(minutes)||minutes<=0)return {ok:false,reason:`${i+1}구간의 실제 시간을 0보다 크게 입력해주세요.`};
  const metresPerMinute=speed*1000/60,vo2=.1*metresPerMinute+1.8*metresPerMinute*(grade/100)+3.5;
  const gross=vo2*weight/200*minutes,active=(vo2-3.5)*weight/200*minutes;
  grossKcal+=gross;activeKcal+=active;durationMinutes+=minutes;
  inputs.push({speedKmh:speed,gradePercent:grade,minutes,vo2,grossKcal:gross,activeKcal:active});
 }
 if(!Number.isFinite(grossKcal)||!Number.isFinite(activeKcal)||!Number.isFinite(durationMinutes))return {ok:false,reason:'입력값이 너무 커서 계산할 수 없어요. 단위와 숫자를 확인해주세요.'};
 return {ok:true,method:'acsm-walking',source:'ACSM 보행식 · 입력 조건 기반',durationMinutes,weightKg:weight,grossKcal,activeKcal,inputs,sourceUrl:'https://pmc.ncbi.nlm.nih.gov/articles/PMC7896743/',version:CARDIO_POLICY_VERSION};
}
function estimateCardioMet(weightKg,minutes,presetId){
 const weight=cardioNumber(weightKg),duration=cardioNumber(minutes),preset=CARDIO_MET_PRESETS.find(p=>p.id===presetId);
 if(!Number.isFinite(weight)||weight<=0)return {ok:false,reason:'체중을 0보다 큰 값으로 입력해주세요.'};
 if(!Number.isFinite(duration)||duration<=0)return {ok:false,reason:'실제 시간을 0보다 크게 입력해주세요.'};
 if(!preset)return {ok:false,reason:'내 운동과 일치하는 활동 조건을 선택해주세요.'};
 const grossKcal=preset.met*3.5*weight/200*duration,activeKcal=(preset.met-1)*3.5*weight/200*duration;
 if(!Number.isFinite(grossKcal)||!Number.isFinite(activeKcal))return {ok:false,reason:'단위와 숫자를 확인해주세요.'};
 return {ok:true,method:'adult-compendium-2024',source:'2024 Adult Compendium · MET',durationMinutes:duration,weightKg:weight,grossKcal,activeKcal,inputs:{presetId,met:preset.met,activityCode:preset.code,minutes:duration},sourceUrl:preset.source,version:CARDIO_POLICY_VERSION};
}
function estimateCardioDevice(activeKcal,minutes,deviceName){
 const active=cardioNumber(activeKcal),duration=cardioNumber(minutes);
 if(!Number.isFinite(active)||active<0)return {ok:false,reason:'기기에 표시된 활동 칼로리를 0 이상으로 입력해주세요.'};
 if(!Number.isFinite(duration)||duration<=0)return {ok:false,reason:'실제 시간을 0보다 크게 입력해주세요.'};
 if(!String(deviceName||'').trim())return {ok:false,reason:'기기 또는 앱 이름을 적어주세요.'};
 return {ok:true,method:'device-active-manual',source:`${String(deviceName).trim()} · 직접 입력`,durationMinutes:duration,grossKcal:null,activeKcal:active,inputs:{activeKcal:active,minutes:duration,deviceName:String(deviceName).trim(),energyType:'active',imported:false},version:CARDIO_POLICY_VERSION};
}
globalThis.RLCardio={estimateWalking:estimateCardioWalking,estimateMet:estimateCardioMet,estimateDevice:estimateCardioDevice,roundKcal:cardioRounded,presets:CARDIO_MET_PRESETS,version:CARDIO_POLICY_VERSION};
function cardioDraft(){
 if(!S.cardioDraft)S.cardioDraft={mode:'calculate',method:'walking',weightKg:Number(S.weight)||83.2,segments:[{speedKmh:5,gradePercent:5,minutes:30}],presetId:'bike50',minutes:30,deviceActive:'',deviceName:'',activity:'트레드밀 걷기',effort:'',fatigue:'',memo:''};
 return S.cardioDraft;
}
function cardioResult(d=cardioDraft()){
 if(d.mode==='device')return estimateCardioDevice(d.deviceActive,d.minutes,d.deviceName);
 if(d.mode==='time'){
  const duration=cardioNumber(d.minutes);
  if(!Number.isFinite(duration)||duration<=0)return {ok:false,reason:'실제 시간을 0보다 크게 입력해주세요.'};
  if(!String(d.activity||'').trim())return {ok:false,reason:'운동 이름을 적어주세요.'};
  return {ok:true,method:'time-only',source:'시간·체감 직접 기록',durationMinutes:duration,grossKcal:null,activeKcal:null,inputs:{minutes:duration},version:CARDIO_POLICY_VERSION};
 }
 return d.method==='walking'?estimateCardioWalking(d.weightKg,d.segments):estimateCardioMet(d.weightKg,d.minutes,d.presetId);
}
function cardioField(label,key,value,{unit='',min='',max='',step='any',type='number',hint=''}={}){
 return `<label class="field cardio-field"><span>${escapeHtml(label)}${unit?` <em>${escapeHtml(unit)}</em>`:''}</span><input type="${type}" data-cardio-key="${attr(key)}" aria-label="${attr(label+(unit?' · '+unit:''))}" value="${attr(value)}" ${type==='number'?`inputmode="decimal" step="${step}" ${min!==''?`min="${min}"`:''} ${max!==''?`max="${max}"`:''}`:''}>${hint?`<small>${escapeHtml(hint)}</small>`:''}</label>`;
}
function cardioChoice(key,items,value,label){return `<div class="cardio-choices" role="group" aria-label="${attr(label)}">${items.map(([v,t])=>`<button type="button" data-cardio-action="choose" data-cardio-key="${key}" data-value="${attr(v)}" aria-pressed="${value===v}" class="${value===v?'is-selected':''}">${escapeHtml(t)}${value===v?'<span aria-hidden="true"> ✓</span>':''}</button>`).join('')}</div>`;}
function cardioResultMarkup(d=cardioDraft()){
 const r=cardioResult(d);
 if(!r.ok)return `<div class="cardio-pending"><strong>입력 조건을 확인해주세요</strong><p>${escapeHtml(r.reason)}</p></div>`;

ption>`).join('')}</select></label>${cardioField('실제 시간','minutes',d.minutes,{unit:'분',min:.1})}<p class="small">와트는 기구의 출력 수치예요. 조건을 모르면 시간만 기록을 선택해주세요.</p>`}</div>`;
 return `<div class="cardio-screen"><p class="small cardio-intro">오늘 한 만큼 기록해요. 소비 열량은 참고용 추정치예요.</p>${cardioChoice('mode',[['calculate','조건 계산'],['device','기기값 입력'],['time','시간만 기록']],d.mode,'유산소 기록 방식')}${inputs}<div data-cardio-result aria-live="polite" aria-atomic="true">${cardioResultMarkup(d)}</div><div class="card cardio-context"><strong>오늘 체감 <small>선택</small></strong><div class="cardio-section-label">운동 중 난도</div>${cardioChoice('effort',[['가벼움','가벼움'],['보통','보통'],['힘듦','힘듦']],d.effort,'운동 중 체감 난도')}<div class="cardio-section-label">지금 피로</div>${cardioChoice('fatigue',[['낮음','낮음'],['보통','보통'],['높음','높음']],d.fatigue,'지금 피로')}<label class="field"><span>메모 <small>선택</small></span><textarea data-cardio-key="memo" placeholder="예: 마지막 10분에 경사를 낮췄어요">${escapeHtml(d.memo)}</textarea></label></div><details class="cardio-calculation"><summary>계산법·출처와 기록 기준</summary><p>걷기: 산소소비량 = 0.1 × 속도 + 1.8 × 속도 × 경사 + 3.5. 속도는 m/분, 경사 5%는 0.05예요. 총 kcal = 산소소비량 × 체중kg ÷ 200 × 시간(분).</p><p>MET: 총 kcal = MET × 3.5 × 체중kg ÷ 200 × 시간(분). 두 방식 모두 표준 휴식분(1 MET)을 제외한 활동 칼로리를 따로 보관해요. 화면은 10 kcal 단위로 반올림해요.</p><p>2024 Adult Compendium은 19–59세 일반 성인의 활동 기준이에요. 개인의 나이·체력·기구·수행 방식에 따라 차이가 나요. 이 시안의 계산 범위는 제품 제한이며 개인별 정확도를 보장하는 범위가 아니에요.</p><p>키·나이·피로에 임의 배수를 곱하지 않아요. 난도와 피로는 다음 루틴을 검토할 때 참고해요. 걸음 수만으로 정확한 열량을 계산하지 않아요.</p><a class="source" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7896743/" target="_blank" rel="noopener">보행식과 추정 오차 연구 ↗</a><a class="source" href="https://pacompendium.com/bicycling/" target="_blank" rel="noopener">2024 활동 MET · 자전거 ↗</a><a class="source" href="https://pacompendium.com/walking/" target="_blank" rel="noopener">2024 활동 MET · 걷기 ↗</a></details><div class="note cardio-note">같은 운동의 기기·걸음·계산값을 더하지 않아요.<br>소비 열량만큼 식사 목표를 자동으로 늘리지 않아요.</div><div class="form-error" data-cardio-error role="alert"></div></div>`;
}

if(typeof document!=='undefined'){
 function updateCardioInput(el){
  const key=el.dataset.cardioKey;if(!key||el.tagName==='BUTTON')return;const d=cardioDraft();

  else if(key==='weightDisplay')d.weightKg=el.value.trim()===''?'':Number(el.value)*(S.units==='imperial'?0.45359237:1);
  else d[key]=el.value;
  const panel=el.closest('.phone');const result=panel?.querySelector('[data-cardio-result]');if(result)result.innerHTML=cardioResultMarkup(d);
  const alert=panel?.querySelector('[data-cardio-error]');if(alert)alert.textContent='';
 }
 document.addEventListener('input',e=>updateCardioInput(e.target));
 document.addEventListener('change',e=>updateCardioInput(e.target));
 document.addEventListener('click',e=>{
  const button=e.target.closest('[data-cardio-action]');if(!button)return;
  const d=cardioDraft(),action=button.dataset.cardioAction;
  if(action==='choose'){
   const key=button.dataset.cardioKey,value=button.dataset.value;
   d[key]=['effort','fatigue'].includes(key)&&d[key]===value?'':value;rerender();

   const activity=d.mode==='calculate'?(d.method==='walking'?'트레드밀 걷기':CARDIO_MET_PRESETS.find(p=>p.id===d.presetId).activity):d.mode==='device'?'기기 운동 기록':String(d.activity).trim();
   S.cardioEntry={...r,inputs:JSON.parse(JSON.stringify(r.inputs)),id:S.cardioEntry?.id||'sample-cardio-session-1',sample:true,activity,effort:d.effort||null,fatigue:d.fatigue||null,memo:String(d.memo).trim(),recordedAt:new Date().toISOString(),reconciledSources:[],targetAdjustmentKcal:0};
   go('W08');message('유산소 한 건을 샘플 기록에 저장했어요. 식사 목표는 유지돼요.');
  }
 });

// Other prototype screens use the same sample day; a live app supplies its local date.
const RECORD_SAMPLE_TODAY='2026-09-23';
function bodyRecords(){return S.bodyRecords||(S.bodyRecords={'2026-09-22':{date:'2026-09-22',kg:83.2,cm:80,memo:''},'2026-09-21':{date:'2026-09-21',kg:83.3,cm:80.1,memo:''}});}
function bodyDateLabel(date){const [y,m,d]=date.split('-').map(Number);const relative=date===RECORD_SAMPLE_TODAY?'오늘':date==='2026-09-22'?'어제':`${y}년`;return `${relative} · ${m}월 ${d}일`;}
function validBodyDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const date=new Date(value+'T00:00:00Z');return Number.isFinite(+date)&&date.toISOString().slice(0,10)===value&&value<=RECORD_SAMPLE_TODAY&&+value.slice(0,4)>=1900;}

function renderBodyRecord(){

function saveBodyMeasurement(container){
 const date=S.measureDate||RECORD_SAMPLE_TODAY,weight=String(S.bodyWeight??'').trim(),waist=String(S.bodyWaist??'').trim();
 const parts=container.querySelector('.measurement-date-fields');if(parts){const y=parts.querySelector('[data-body-date-part="year"]').value,m=parts.querySelector('[data-body-date-part="month"]').value,d=parts.querySelector('[data-body-date-part="day"]').value;const shown=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(!validBodyDate(shown)||shown!==date)return error(container,'선택한 측정 날짜를 먼저 확인해주세요.');}
 if(!validBodyDate(date))return error(container,'오늘까지의 실제 측정 날짜를 선택해주세요.');

 S.bodySaved=!!bodyRecords()[RECORD_SAMPLE_TODAY];S.lastBodySavedDate=date;S.bodyDateExpanded=false;go('H01');message(`${bodyDateLabel(date)} 측정값을 샘플 기록에 저장했어요.`);

function applyRecordingRefinements(){

/* Flexible meal slots. Planned meals and actual entries remain separate. */
const MEAL_SLOT_LIBRARY = [
 {id:'breakfast',name:'기본 아침',description:'곡물 · 요거트 · 블루베리',kcal:420,macros:[55,24,12],foods:[['곡물','50 g'],['그릭요거트','150 g'],['블루베리','50 g']]},
 {id:'rice',name:'밥 · 닭가슴살 세트',description:'밥 · 닭가슴살 · 김치',kcal:860,macros:[105,70,18],foods:[['발아현미 + 백미밥','조리 후 300 g'],['닭가슴살','확인한 제품 · 300 g'],['김치','100 g']]},
 {id:'pasta',name:'닭가슴살 파스타',description:'건면 · 닭가슴살 · 올리브유',kcal:900,macros:[103,70,23],foods:[['파스타','조리 전 200 g'],['닭가슴살','확인한 제품 · 300 g'],['올리브유 · 양념','확인한 레시피 기준']]}
];
function ensureMealSlots(){
 if(!S.mealSlots)S.mealSlots=[{id:'breakfast',name:'아침',templateId:'breakfast'},{id:'lunch',name:'점심',templateId:'rice'},{id:'dinner',name:'저녁',templateId:'rice'}];
 if(!S.mealEntries)S.mealEntries={breakfast:{status:'eaten',name:'기본 아침',kcal:420,macros:[55,24,12],source:'sample-confirmed',templateId:'breakfast'}};
 if(!S.selectedMealSlot||!S.mealSlots.some(x=>x.id===S.selectedMealSlot))S.selectedMealSlot=S.mealSlots.find(x=>x.id==='lunch'&&!x.archived)?.id||S.mealSlots.find(x=>!x.archived)?.id;
}
function mealSlots(){ensureMealSlots();return S.mealSlots.filter(x=>!x.archived);}
function mealSlot(){ensureMealSlots();return S.mealSlots.find(x=>x.id===S.selectedMealSlot)||mealSlots()[0];}
function mealTemplate(id){return MEAL_SLOT_LIBRARY.find(x=>x.id===id);}
function mealDraft(){
 const slot=mealSlot();
 if(!S.mealSlotDraft||S.mealSlotDraft.slotId!==slot.id){
  const entry=S.mealEntries[slot.id];
  S.mealSlotDraft={slotId:slot.id,templateId:entry?entry.templateId||null:slot.templateId||null,qtyEdited:!!entry?.qtyEdited,qty:entry?.qty||null};
 }
 return S.mealSlotDraft;
}
function selectMealSlot(id){
 ensureMealSlots();if(!S.mealSlots.some(x=>x.id===id))return;
 S.selectedMealSlot=id;S.mealSlotDraft=null;S.qtyEdited=false;S.qty=120;S.actualMealName='';S.mealScope='today';S.foodReason='';
 const entry=S.mealEntries[id];S.unknownFood=entry?.source==='name-only'?entry.name:'';S.unknownMemo=entry?.memo||'';
 const draft=mealDraft();S.qtyEdited=draft.qtyEdited;if(draft.qty)S.qty=draft.qty;
 S.replacement=mealTemplate(draft.templateId)?.name||'닭가슴살 파스타';
}
function mealTotals(){
 ensureMealSlots();let kcal=0,macros=[0,0,0],unknown=0;
 for(const entry of Object.values(S.mealEntries))if(entry.status==='eaten'){
  if(Number.isFinite(entry.kcal)&&Array.isArray(entry.macros)){kcal+=entry.kcal;macros=macros.map((n,i)=>n+entry.macros[i]);}else unknown++;
 }
 return {kcal,macros,unknown,confirmed:mealSlots().filter(x=>S.mealEntries[x.id]).length,total:mealSlots().length};
}
function mealSlotStatus(entry){return !entry?'기록 전':entry.status==='skipped'?'먹지 않음':entry.kcal===null?'영양 미확인':'기록 완료';}
function mealSlotButton(label,act,id,cls=''){return `<button type="button" class="btn ${cls}" data-meal-action="${act}" data-meal-slot="${attr(id)}">${label}</button>`;}
function mealSlotOpen(label,id,to,cls=''){return `<button type="button" class="btn ${cls}" data-meal-action="open" data-meal-slot="${attr(id)}" data-meal-to="${to}">${label}</button>`;}
function mealSlotManager(){
 if(!S.mealSlotsEditing)return '';
 return `<section class="meal-slot-manager" aria-label="끼니 편집"><div class="row"><strong>내 하루에 맞는 끼니</strong>${mealSlotButton('닫기','manage','','tiny')}</div><p class="small">횟수와 이름을 정해두고, 먹은 뒤에 기록해요.</p>${mealSlots().map(slot=>`<div class="meal-slot-edit-row"><label><span class="sr-only">${escapeHtml(slot.name)} 끼니 이름</span><input type="text" value="${attr(slot.name)}" maxlength="20" data-meal-name="${attr(slot.id)}" aria-label="${attr(slot.name)} 끼니 이름"></label>${mealSlotButton('변경','rename',slot.id,'tiny')}${mealSlotButton(icon('X'),'remove',slot.id,'tiny meal-slot-remove').replace('<button ','<button aria-label="'+attr(slot.name)+' 끼니에서 제외" ')}</div>`).join('')}<div class="meal-slot-add"><label><span>추가할 끼니 이름</span><input type="text" value="${attr(S.newMealSlotName||'')}" maxlength="20" data-meal-new-name placeholder="예: 운동 후 식사, 오후 간식"></label>${mealSlotButton(`${icon('Plus')} 끼니 추가`,'add','','full')}</div><p class="footnote">횟수 변경만으로 하루 영양 목표는 바뀌지 않아요. 이미 남긴 섭취 기록은 유지해요.</p><div class="form-error" role="alert"></div></section>`;
}
function mealSlotCard(slot){

/* Keep the native select as the data source; present its options as a mobile sheet. */
let mobilePickerActive=null;
const mobilePickerTriggers=new WeakMap();

function mobilePickerLabel(select){
 const label=select.labels?.[0]||select.closest('label');
 const visible=label?.querySelector(':scope > span');
 if(visible?.textContent.trim())return visible.textContent.trim();
 const labelled=(select.getAttribute('aria-labelledby')||'').split(/\s+/).map(id=>document.getElementById(id)?.textContent||'').join(' ').trim();
 if(labelled)return labelled;
 if(select.getAttribute('aria-label'))return select.getAttribute('aria-label');
 if(label){const copy=label.cloneNode(true);copy.querySelectorAll('select,input,button,small').forEach(el=>el.remove());if(copy.textContent.trim())return copy.textContent.trim();}
 return '항목 선택';
}
function mobilePickerOptionDisabled(option){return option.disabled||option.parentElement?.tagName==='OPTGROUP'&&option.parentElement.disabled;}
function mobilePickerSync(select){
 const trigger=mobilePickerTriggers.get(select);if(!trigger)return;
 const value=trigger.querySelector('.mobile-picker-value');
 const selected=Array.from(select.selectedOptions).map(option=>option.textContent.trim()).join(', ');
 value.textContent=selected||(select.options.length?'선택해 주세요':'선택 항목 없음');
 trigger.disabled=select.disabled||!Array.from(select.options).some(option=>!mobilePickerOptionDisabled(option));
 trigger.setAttribute('aria-label',`${trigger.dataset.pickerLabel}: ${value.textContent}`);
}
function enhanceMobileSelects(scope=document){
 if(mobilePickerActive&&(!mobilePickerActive.select.isConnected||!mobilePickerActive.overlay.isConnected))closeMobilePicker(false);
 scope.querySelectorAll('.phone select').forEach((select,index)=>{
  if(mobilePickerTriggers.has(select)){mobilePickerSync(select);return;}
  const name=mobilePickerLabel(select),phone=select.closest('.phone');
  const identity=`mobile-select-${phone.dataset.screen}-${index}`;
  const label=select.closest('label');
  // A label must not contain both a hidden select and a second labelable button.
  if(label){const field=document.createElement('div');for(const attribute of label.attributes)if(attribute.name!=='for')field.setAttribute(attribute.name,attribute.value);field.classList.add('mobile-picker-field');while(label.firstChild)field.append(label.firstChild);label.replaceWith(field);}
  const trigger=document.createElement('button');trigger.type='button';trigger.className='mobile-picker-trigger';trigger.id=identity+'-trigger';
  trigger.dataset.mobilePickerTrigger=identity;trigger.dataset.pickerLabel=name;
  trigger.setAttribute('aria-haspopup','dialog');trigger.setAttribute('aria-expanded','false');
  const value=document.createElement('span');value.className='mobile-picker-value';value.id=identity+'-value';
  const chevron=document.createElement('span');chevron.className='mobile-picker-chevron';chevron.setAttribute('aria-hidden','true');chevron.textContent='⌄';
  trigger.append(value,chevron);select.insertAdjacentElement('afterend',trigger);
  select.classList.add('mobile-picker-native');select.hidden=true;select.tabIndex=-1;select.setAttribute('aria-hidden','true');
  if(!select.getAttribute('aria-label'))select.setAttribute('aria-label',name);
  mobilePickerTriggers.set(select,trigger);mobilePickerSync(select);
  trigger.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();openMobilePicker(select,trigger);});
  select.addEventListener('change',()=>mobilePickerSync(select));
 });
}
function mobilePickerRestoreFocus(trigger,identity){
 const target=trigger?.isConnected?trigger:Array.from(document.querySelectorAll('[data-mobile-picker-trigger]')).find(el=>el.dataset.mobilePickerTrigger===identity);
 if(target&&!target.disabled&&!target.closest('[inert]'))target.focus({preventScroll:true});
}
function closeMobilePicker(restoreFocus=true){
 const active=mobilePickerActive;if(!active)return;
 mobilePickerActive=null;active.observer.disconnect();
 active.overlay.remove();active.trigger.setAttribute('aria-expanded','false');active.trigger.removeAttribute('aria-controls');
 active.inert.forEach(([element,wasInert])=>{element.inert=wasInert;});
 active.phone.classList.remove('has-mobile-picker');
 if(restoreFocus)mobilePickerRestoreFocus(active.trigger,active.identity);
}
function mobilePickerCommit(index){
 const active=mobilePickerActive;if(!active)return;
 const {select,trigger,identity}=active,option=select.options[index];
 if(!option||mobilePickerOptionDisabled(option)||select.disabled)return;
 const changed=select.selectedIndex!==index;
 closeMobilePicker(true);
 if(!changed)return;
 select.selectedIndex=index;mobilePickerSync(select);
 // Existing input handlers store the value; change handlers may rebuild the screen.
 select.dispatchEvent(new Event('input',{bubbles:true}));
 select.dispatchEvent(new Event('change',{bubbles:true}));
 queueMicrotask(()=>mobilePickerRestoreFocus(trigger,identity));

function openMobilePicker(select,trigger){
 if(select.disabled||trigger.disabled||!select.isConnected)return;
 closeMobilePicker(false);
 const phone=select.closest('.phone'),identity=trigger.dataset.mobilePickerTrigger;
 const overlay=document.createElement('div');overlay.className='mobile-picker-overlay';
 const scrim=document.createElement('div');scrim.className='mobile-picker-scrim';scrim.setAttribute('aria-hidden','true');
 const dialog=document.createElement('section');dialog.className='mobile-picker-sheet';dialog.id=identity+'-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby',identity+'-title');dialog.tabIndex=-1;

 const header=document.createElement('header');header.className='mobile-picker-heading';
 const heading=document.createElement('h3');heading.id=identity+'-title';heading.textContent=trigger.dataset.pickerLabel;
 const close=document.createElement('button');close.type='button';close.className='mobile-picker-close';close.setAttribute('aria-label','선택창 닫기');close.textContent='×';close.addEventListener('click',()=>closeMobilePicker());

 const rows=[];let group='';
 Array.from(select.options).forEach((option,index)=>{
  const groupName=option.parentElement?.tagName==='OPTGROUP'?option.parentElement.label:'';
  if(groupName&&groupName!==group){const groupHeading=document.createElement('div');groupHeading.className='mobile-picker-group';groupHeading.textContent=groupName;list.append(groupHeading);group=groupName;}
  const button=document.createElement('button');button.type='button';button.className='mobile-picker-option';button.dataset.pickerIndex=index;
  button.setAttribute('role','option');button.setAttribute('aria-selected',index===select.selectedIndex);button.disabled=mobilePickerOptionDisabled(option);button.tabIndex=-1;
  const text=document.createElement('span');text.className='mobile-picker-option-text';text.textContent=option.textContent.trim();
  const check=document.createElement('span');check.className='mobile-picker-check';check.setAttribute('aria-hidden','true');check.textContent=index===select.selectedIndex?'✓':'';
  button.append(text,check);button.addEventListener('click',()=>mobilePickerCommit(index));list.append(button);rows.push({button,text:option.textContent.trim(),group:groupName});
 });
 const empty=document.createElement('p');empty.className='mobile-picker-empty';empty.textContent='일치하는 항목이 없어요.';empty.hidden=true;list.append(empty);
 const live=document.createElement('p');live.className='mobile-picker-result';live.setAttribute('role','status');live.setAttribute('aria-live','polite');
 let search=null;
 if(rows.length>=8){
  const label=document.createElement('label');label.className='mobile-picker-search';
  const sr=document.createElement('span');sr.className='sr-only';sr.textContent='선택 항목 검색';
  search=document.createElement('input');search.type='search';search.placeholder='항목 검색';search.autocomplete='off';search.setAttribute('aria-label','선택 항목 검색');
  search.addEventListener('input',()=>{
   const term=search.value.trim().toLocaleLowerCase();let count=0;
   rows.forEach(row=>{row.button.hidden=!`${row.group} ${row.text}`.toLocaleLowerCase().includes(term);if(!row.button.hidden)count++;});
   list.querySelectorAll('.mobile-picker-group').forEach(el=>{el.hidden=!!term;});
   empty.hidden=count!==0;live.textContent=term?`${count}개 항목`:'';
   const eligible=rows.filter(row=>!row.button.hidden&&!row.button.disabled);rows.forEach(row=>row.button.tabIndex=-1);
   const first=eligible.find(row=>row.button.getAttribute('aria-selected')==='true')||eligible[0];if(first)first.button.tabIndex=0;
  });label.append(sr,search);dialog.append(label,live);
 }
 dialog.append(list);
 const footer=document.createElement('footer');footer.className='mobile-picker-footer';
 const cancel=document.createElement('button');cancel.type='button';cancel.className='mobile-picker-cancel';cancel.textContent='취소';cancel.addEventListener('click',()=>closeMobilePicker());footer.append(cancel);dialog.append(footer);
 overlay.append(scrim,dialog);
 const inert=Array.from(phone.children).map(element=>[element,element.inert]);phone.append(overlay);
 const observer=new MutationObserver(()=>{if(mobilePickerActive&&(!select.isConnected||!overlay.isConnected))closeMobilePicker(false);});observer.observe(document.getElementById('main')||document.body,{childList:true,subtree:true});
 mobilePickerActive={select,trigger,identity,phone,overlay,dialog,list,rows,search,inert,observer};
 inert.forEach(([element])=>{element.inert=true;});phone.classList.add('has-mobile-picker');
 trigger.setAttribute('aria-expanded','true');trigger.setAttribute('aria-controls',dialog.id);
 scrim.addEventListener('click',()=>closeMobilePicker());
 const first=rows.find(row=>row.button.getAttribute('aria-selected')==='true'&&!row.button.disabled)||rows.find(row=>!row.button.disabled);
 if(first)first.button.tabIndex=0;
 requestAnimationFrame(()=>{if(mobilePickerActive?.overlay!==overlay||dialog.contains(document.activeElement))return;(first?.button||search||close).focus({preventScroll:true});first?.button.scrollIntoView({block:'nearest',behavior:'instant'});});
}

document.addEventListener('keydown',event=>{
 const active=mobilePickerActive;if(!active)return;
 if(event.key==='Escape'){event.preventDefault();event.stopImmediatePropagation();closeMobilePicker();return;}
 if(event.key==='Tab'){
  const focusable=Array.from(active.dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),[tabindex="0"]')).filter(el=>el.tabIndex>=0&&!el.hidden&&el.getClientRects().length);
  const first=focusable[0],last=focusable[focusable.length-1];
  if(!first){event.preventDefault();active.dialog.focus();return;}
  if(event.shiftKey&&(document.activeElement===first||!active.dialog.contains(document.activeElement))){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&(document.activeElement===last||!active.dialog.contains(document.activeElement))){event.preventDefault();first.focus();}
  event.stopPropagation();return;
 }
 if(!['ArrowDown','ArrowUp','Home','End'].includes(event.key)||document.activeElement===active.search)return;
 const options=active.rows.map(row=>row.button).filter(button=>!button.disabled&&!button.hidden);
 if(!options.length)return;
 const index=options.indexOf(document.activeElement),next=event.key==='Home'?0:event.key==='End'?options.length-1:event.key==='ArrowDown'?(index+1+options.length)%options.length:(index-1+options.length)%options.length;

  ['최근 2주, 실제로 한 운동','최근 2주 동안 한 운동'],
  ['아직 운동을 시작하지 않았다면 0일로 선택해도 돼요. 할 수 있는 날과 이미 한 운동은 따로 반영해요.','아직 시작하지 않았다면 0일을 골라주세요. 앞으로의 일정은 따로 정할 수 있어요.']
 ],
 A07:[
  ['자동 제안 · 기본','자동으로 정하기'],
  ['근육 증가를 위해 유지 추정량보다 소폭 높인 시작안','근육 증가를 위해 유지 열량보다 조금 높게 시작해요.'],
  ['체중 감량을 위해 유지 추정량보다 완만하게 낮춘 시작안','체중 감량을 위해 유지 열량보다 조금 낮게 시작해요.'],
  ['현재 체중과 운동 수행의 유지를 위한 시작안','현재 체중과 운동 수행을 유지하는 기준으로 시작해요.'],
  ['정확히 맞혀야 하는 시험이 아니에요. 우선 이 기준으로 기록하고, 여러 주의 실제 섭취·체중·허리·수행 변화를 보며 조정해요.','매일 정확히 맞추지 않아도 괜찮아요. 몇 주간의 식사와 몸의 변화를 보며 조정해요.'],
  ['허리둘레는 변화 비교용이에요. 앞으로 운동 가능한 날을 이미 수행한 운동량으로 더하지 않았어요. 단백질은 현재 운동 또는 근육 유지·증가 목적의 근력운동을 고려한 시작안이에요.','최근 운동과 생활 활동으로 계산했어요. 앞으로의 운동 일정은 포함하지 않았고, 허리둘레는 몸의 변화를 비교할 때 사용해요. 단백질 목표에는 현재 운동과 근육 유지·증가 목표를 함께 고려했어요.'],
  ['계산 기준과 추정의 한계','목표를 어떻게 계산했나요?'],
  ['2. 활동과 목적 · 시안 정책','2. 생활 활동과 목표 반영'],
  ['3. 영양 배분 · 시안 정책','3. 탄수화물·단백질·지방 나누기'],
  ['생활 + 실제 운동 활동계수','생활·최근 운동을 반영한 배수'],
  ['유지 에너지 추정','체중 유지에 필요한 열량 · 추정'],
  ['휴식 에너지 × 활동계수 × 목적 계수, 마지막에 50 kcal 단위로 반올림해요. 활동계수는 1.3–1.9 범위의 시안 구간표예요. 유지 ×1.0 · 증가 ×1.05 · 감량 ×0.9를 사용해요.','휴식 에너지에 생활·최근 운동에 따른 배수(1.3–1.9)를 적용해요. 유지 목표는 그대로, 근육 증가는 5% 높게, 체중 감량은 10% 낮게 시작하며 50 kcal 단위로 반올림해요.'],
  ['공개된 휴식 에너지 공식과 앱의 시작 정책을 구분해요. 활동 구간·목적별 조정폭·영양 배분은 검토 중인 시안 정책이며 개인에게 검증된 처방값은 아니에요. 걸음·운동 칼로리를 활동계수에 다시 더하지 않아요.','휴식 에너지는 아래 연구의 공식으로 추정해요. 활동 배수와 목표별 조정폭·영양 배분은 루틴로그의 임시 시작 기준으로, 연구가 개인별 적정량을 보장하는 값은 아니에요. 걸음과 운동 열량은 여기에 다시 더하지 않아요.'],
  ['단백질·지방·탄수화물 합계와 열량의 배분을 확인한 뒤 저장해요.','열량과 탄단지 목표가 서로 맞는지 확인해주세요.']
 ],
 H02:[['자주 먹는 아침·점심·저녁을 묶어둬요.','내 식사 횟수에 맞춰 자주 먹는 음식을 저장해요.'],['일주일 운동 배치','일주일 운동 정하기']],
 H03:[['먹은 음식이나 운동이 달라져도, 실제를 기록하면 기록 완료로 표시돼요.','계획과 달라도 괜찮아요. 먹고 운동한 만큼 기록하면 돼요.']],
 H05:[['단기 변화와 여러 주 추세를 함께 봐요. 이 기록만으로 체성분 변화를 확정하지 않아요.','하루의 숫자보다 여러 주의 흐름을 함께 봐요. 체중·허리 기록만으로 근육과 지방의 변화를 알 수는 없어요.']],
 H06:[['휴대폰을 두고 움직인 시간은 빠질 수 있어요. 걸음수와 운동 기록을 합쳐 정확한 소비 열량으로 표시하지 않아요.','휴대폰을 두고 움직인 시간은 빠질 수 있어요. 걸음만으로 정확한 소비 열량을 알 수는 없어요.']],
 H07:[
  ['오늘 남길 기록','오늘의 상태'],
  ['아직 선택한 항목이 없어요.','기억하고 싶은 항목만 남겨주세요.'],
  ['비워둔 항목은 ‘미기록’으로 남아요.','모든 항목을 채우지 않아도 돼요.'],
  ['내가 느낀 상태를 기록해요. 회복 완료 여부로 단정하지 않아요.','내가 느낀 상태를 남겨요. 회복 정도를 정확히 측정하는 기록은 아니에요.']
 ],
 F02:[
  ['선택하면 이 끼니의 기본값으로 연결해요.','평소 먹는 식사를 골라두세요.'],
  ['실제 섭취는 먹은 뒤 따로 확인해요.','먹은 날에는 ‘그대로 먹음’만 눌러주세요.'],
  ['끼니 기본값','끼니별 기본 식사'],
  ['영양값은 시안의 저장 식사 예시예요.','먹는 제품과 양에 따라 영양정보가 달라질 수 있어요.']
 ],
 F03:[
  ['이 구성 합계','식사 합계'],
  ['레시피 · 원본 정보','레시피 · 영양정보'],
  ['구성을 확인한 뒤 기록해요. 숫자는 저장 식사 예시이며 실제 식품 DB는 연결하지 않았어요.','실제로 먹은 음식과 양을 확인해주세요.'],
  ['음식의 양을 수정했어요. 변경한 음식은 아래에서 확인하고, 식사 전체 영양정보는 미확인으로 남겨요.','바꾼 양을 아래에서 확인해주세요. 식사 전체 영양정보는 아직 확인이 필요해요.']
 ],
 F04:[['원본 예시: 80 g당 160 kcal · 단백질 20 g','제품 표기: 80 g당 160 kcal · 단백질 20 g'],['식이섬유는 원문에 없어 정보 없음','식이섬유는 제품에 표시되지 않았어요.']],
 F06:[['제품 사진이 없으면 음식 분류 아이콘으로 표시해요. 같은 이름이어도 원본과 기준량을 확인해요.','같은 음식도 제품과 조리 상태에 따라 달라요. 영양정보의 기준량을 확인해주세요.'],['찾는 음식이 없어요 · 등록','찾는 음식 직접 등록']],
 F07:[['‘정보 없음’은 0 g과 달라요. 확인되지 않은 영양값은 합계에서 별도로 표시해요.','‘정보 없음’은 0 g이 아니에요. 확인된 영양정보만 합계에 포함해요.'],['이미지 없음 · 직접 입력한 제품','직접 입력한 영양정보']],
 F08:[['확인할 수 있는 원본에서 영양정보를 가져와요.','영양정보를 확인할 방법을 골라주세요.'],['라벨에서 항목을 읽은 뒤 직접 확인','사진에서 읽은 내용을 확인하고 저장'],['제품의 영양표 기준량 그대로','제품에 적힌 기준량과 영양정보 입력']],
 F09:[['추출된 값은 저장 전에 확인할 수 있어요.','읽은 내용은 저장 전에 확인할 수 있어요.'],['샘플 라벨 읽기','영양정보 확인']],
 F10:[
  ['6개 항목을 읽었어요. 표시된 항목을 확인해주세요.','제품명과 영양정보를 확인해주세요.'],
  ['원본과 비교 · g','제품 표기 확인 · g'],
  ['원본 사진 확대','영양성분표 사진 보기'],
  ['영양성분표 원본 이미지 영역','사진을 확인할 수 없어요.'],
  ['샘플 시안 · 실제 첨부 이미지 없음','제품 성분표를 보고 직접 확인해주세요.']
 ],
 F11:[['추출된 영양값 검토','읽은 영양정보 확인'],['URL 정보 확인 · 실패 예시','영양정보 가져오기']],
 F12:[['사진으로 등록한 후 추출값을 확인할 수 있어요.','사진에서 읽은 내용을 확인하고 저장할 수 있어요.']],
 F14:[['전체 레시피의 50%를 먹은 기록이에요. 재료의 영양정보가 비어 있으면 합계도 일부 확인으로 표시해요.','전체 요리의 절반을 먹은 양이에요. 영양정보가 없는 재료는 합계에 포함하지 않아요.'],['대체 식사로만 저장','저장 식사에만 추가']],
 F15:[['어디에 반영할까요?','기본 식단도 바꿀까요?'],['오늘 기록만 변경','오늘만 기록'],['오늘 기록 + 기본 식단 변경','다음 식단에도 반영'],['기록할 양','먹은 양'],['확인한 음식 · 양','확인한 구성 그대로']],
 F16:[['먹은 사실을 남길 끼니','기록할 끼니']],
 W01:[['이번 주 일정이 달라도 괜찮아요. 수행한 기록은 남기고, 앞으로 할 계획만 바꿔요.','일정이 달라졌다면 앞으로 할 운동만 옮겨보세요. 이미 남긴 기록은 유지돼요.']],
 W02:[
  ['선택한 목적에 맞는 순서예요. 같은 프로그램도 목표에 맞춰 조정해요.','내 목표와 일정에 맞는 구성을 골라보세요.'],
  ['건강한 성인 연구의 원칙을 참고한 루틴로그 구성안이에요. 선수·학자가 이 앱의 운동표를 직접 작성한 것은 아니에요.','루틴로그가 구성한 프로그램이에요. 참고한 연구와 적용 범위는 상세에서 확인할 수 있어요.']
 ],
 W03:[
  ['반복수·세트·수행 여유를 먼저 쌓고, 변화는 한 가지씩 검토해요.','반복수와 세트, 운동이 얼마나 여유로웠는지 보며 하나씩 조정해요.'],
  ['누가 만들었고, 어떤 근거인가요?','만든 곳과 참고 연구'],
  ['아래 연구의 원칙을 참고해 종목을 편성했어요. 이 운동표 자체의 효과가 임상시험으로 검증된 것은 아니에요.','아래 연구의 운동 원칙을 참고했어요. 이 운동표 자체의 효과를 검증한 임상시험은 아니에요.'],
  ['주간 운동량을 맞추면 전신과 분할 사이에 뚜렷한 평균 효과 차이가 없었어요. 선호와 일정도 함께 고려해요.','일주일 운동량이 같을 때 전신·분할 운동의 평균 효과 차이는 뚜렷하지 않았어요. 내 일정과 선호에 맞춰 고를 수 있어요.'],
  ['같은 종목의 실제 반복·난도·불편함을 비교해요.','같은 운동의 반복수·난도·불편함을 함께 봐요.'],
  ['범위 상단을 여유 있게 반복 수행했을 때만 작은 증량을 제안해요.','목표 반복수의 상한까지 여러 번 여유 있게 했다면 조금 무거운 중량을 제안해요.'],
  ['회복을 일정만으로 확정하지 않아요. 제안은 적용·수정·보류할 수 있어요.','회복 속도는 사람마다 달라요. 내 상태를 보고 제안을 적용·수정·보류할 수 있어요.'],
  ['코치의 다른 프로그램도 궁금해요','다른 코치의 프로그램 보기'],
  ['별도 제작자의 공개 소개예요. 현재 앱에서 바로 적용하는 6개 구성과 구분해요.','제작자의 소개 페이지로 이동해요. 아래 프로그램은 앱에서 바로 적용할 수 없어요.']
 ],
 W04:[
  ['내 조건으로 시작했어요','내 일정에 맞춘 첫 주'],
  ['요일 카드를 펼쳐 세트·반복·중량을 바꿀 수 있어요.','운동할 날을 눌러 세트·반복수·중량을 조정해보세요.'],
  ['배치할 때 고려한 점','이렇게 구성한 이유'],
  ['남은 세트를 다음 주에 자동으로 더하지 않아요.','못 한 운동을 다음 주에 몰아서 채울 필요는 없어요.'],
  ['첫 주에는 중량을 정해주지 않아요. 동작을 익히며 여유 있게 할 수 있는 무게를 기록해주세요.','첫 운동은 자세를 유지하며 여유 있게 할 수 있는 무게로 시작해보세요.'],
  ['진행 방식','중량·반복수 조정 방식']
 ],
 W05:[['기구가 같아도 운동 변형은 따로 기록해요. 찾는 운동이 없으면 직접 등록할 수 있어요.','같은 기구라도 동작에 맞는 운동을 골라주세요. 찾는 운동이 없으면 직접 등록할 수 있어요.'],['덤벨 · 편측 기록','덤벨 · 좌우 각각 기록']],
 W06:[['동작 이미지와 영상은 준비 중이에요.','이 운동의 동작 영상은 아직 없어요.']],
 W07:[['주요 부위','주로 운동하는 부위'],['보조 부위 (선택)','함께 운동되는 부위 · 선택'],['중량 기준','무게를 적는 기준']],

function productReplace(text,pairs){let out=String(text??'');for(const [before,after] of pairs)out=out.split(before).join(after);return out;}
function productText(text,id){return productMessage(productReplace(text,PRODUCT_SCREEN_COPY[id]||[]));}
function productHtml(html,id){
 // Only text nodes are rewritten: routes, state values, native option values,
 // accessibility attributes, user-entered notes and formulas are preserved.
 let skip='';
 return String(html??'').split(/(<[^>]+>)/g).map(part=>{
  if(part.startsWith('<')){const open=part.match(/^<(textarea|option|code)\b/i),close=part.match(/^<\/(textarea|option|code)\b/i);if(open)skip=open[1].toLowerCase();if(close&&close[1].toLowerCase()===skip)skip='';return part;}
  return skip?part:productText(part,id);
 }).join('');
}

function applyProductCopy(){
 for(const sc of RL.screens){
  if(sc.productCopyApplied)continue;
  const render=sc.render,footer=sc.footer;
  sc.render=()=>{
   let html=render();
   // Remove preview-only branches, retaining them in the screen atlas/specs.
   if(sc.id==='A02')html=html.replace('<span class="fine">디자인 시안의 요약입니다. 실제 약관 문안은 별도 확정합니다.</span>','');
   if(sc.id==='F10')html=html.replace('value="샘플 단백질 제품"','value="등록할 단백질 제품"');
   return productHtml(html,sc.id);
  };
  if(footer)sc.footer=()=>productHtml(footer(),sc.id);
  sc.title=productText(sc.title,sc.id);if(sc.subtitle)sc.subtitle=productText(sc.subtitle,sc.id);
  Object.defineProperty(sc,'productCopyApplied',{value:true,enumerable:false});
 }
 // Success/failure branches remain available through the atlas, not as app CTAs.
 RL.screens.find(s=>s.id==='F11').footer=()=>B('영양정보 가져오기','F12','primary full');
 // These helpers can update a fragment without calling a screen renderer.
 if(typeof foodResults==='function'){const food=foodResults;foodResults=(...args)=>productHtml(food(...args),'F06');}
 if(typeof exerciseResults==='function'){const exercise=exerciseResults;exerciseResults=(...args)=>productHtml(exercise(...args),'W05');}
 if(typeof cardioResultMarkup==='function'){const cardioMarkup=cardioResultMarkup;cardioResultMarkup=(...args)=>productHtml(cardioMarkup(...args),'W15');}
}

function headerAction(label,to){const names={'설정':'Settings','달력':'CalendarDays','닫기':'X','‹':'ChevronLeft'};return `<button type="button" class="btn ${names[label]?'':'text-head-action'}" data-go="${to}" aria-label="${attr(label==='‹'?'뒤로 가기':label)}">${names[label]?icon(names[label]):label}</button>`;}
function phone(sc){
 const tabs=[['오늘','H01','House'],['식단','F01','Utensils'],['운동','W01','Dumbbell'],['리포트','R01','ChartNoAxesCombined']];
 const root=['H01','F01','W01','R01'].includes(sc.id),sheet=['F04','R06'].includes(sc.id),step=/^A0[2-8]$/.test(sc.id)?+sc.id.slice(2)-1:0;
 const title=sc.id==='H01'?'9월 23일':sc.id==='F01'?'오늘 식단':sc.id==='R01'?'지난주 리포트':sc.title;
 const subtitle=sc.id==='H01'?'수요일 · 12주째 기록':sc.subtitle;
 const back=sc.back?headerAction('‹',sc.back).replace('class="btn ','class="btn back-action '):'';
 const heading=step?`<header class="app-head onboarding-head"><div class="onboarding-nav">${back}<span>${escapeHtml(subtitle.split('·').slice(1).join('·').trim())}</span><span class="step-count">${step} / 7</span></div><div class="headcopy"><h2 tabindex="-1">${title}</h2></div></header>`:sc.back&&!sheet&&!root?`<header class="app-head detail-head"><div class="detail-nav">${back}<span class="nav-context">${escapeHtml(RL.groups[sc.group]||'루틴로그')}</span>${sc.headAction?headerAction(...sc.headAction):''}</div><div class="headcopy"><h2 tabindex="-1">${title}</h2>${subtitle?`<small>${subtitle}</small>`:''}</div></header>`:`<header class="app-head ${root?'root-head':''}"><div class="headcopy">${sc.id==='H01'?'<div class="header-brand">나만의 루틴로그</div>':''}<h2 tabindex="-1">${title}</h2>${subtitle?`<small>${subtitle}</small>`:''}</div>${sheet?headerAction('닫기',sc.back):sc.headAction?headerAction(...sc.headAction):sc.id==='H01'?headerAction('달력','H03'):''}</header>`;
 const body=`${heading}${step?`<div class="onboarding-progress" role="progressbar" aria-label="온보딩 진행" aria-valuemin="0" aria-valuemax="7" aria-valuenow="${step}"><span style="width:${step/7*100}%"></span></div>`:''}<div class="app-body">${sc.render()}</div>${sc.footer?`<footer class="app-foot">${sc.footer()}</footer>`:''}`;
 return `<article class="phone ${sheet?'has-sheet':''}" data-screen="${sc.id}" aria-label="${sc.title}"><div class="status" aria-hidden="true"><span>9:41</span><span class="system-icons">${icon('Signal')}${icon('Wifi')}${icon('BatteryFull')}</span></div>${sheet?`<div class="sheet-underlay" aria-hidden="true"><h3>${sc.id==='F04'?'점심 기본 세트':'다음 주 초안'}</h3><div class="card"><div class="skeleton-line" style="width:65%"></div><div class="skeleton-line" style="width:40%"></div></div><div class="card"><div class="skeleton-line"></div><div class="skeleton-line" style="width:70%"></div></div></div><div class="sheet-backdrop" aria-hidden="true"></div><section class="sheet-panel" aria-label="${sc.title}"><div class="sheet-handle" aria-hidden="true"></div>${body}</section>`:body}${sc.tab?`<nav class="tabbar" aria-label="앱 기본 탭">${tabs.map(([t,id,g])=>`<button data-go="${id}" class="${sc.tab===t?'current':''}" ${sc.tab===t?'aria-current="page"':''}><span class="navglyph">${icon(g)}</span><span>${t}</span></button>`).join('')}</nav>`:''}</article>`;
}
function motionAllowed(){return !matchMedia('(prefers-reduced-motion: reduce)').matches&&!document.body.classList.contains('motion-off');}
function render(){
 const oldId=document.querySelector('.phone')?.dataset.screen;
 const oldNumbers=Object.fromEntries([...document.querySelectorAll('[data-number],.stepper input')].map(el=>[el.dataset.number||el.dataset.key,el.value??el.textContent]));
 const oldSegments=Object.fromEntries([...document.querySelectorAll('[data-segment]')].map(el=>[el.dataset.segment,+el.dataset.selectedIndex]));
 const focusEl=document.activeElement,focusSpec=focusEl?.dataset?{...focusEl.dataset}:null;
 const active=findScreen(S.current)||findScreen('H01');
 $('#count').textContent=`${RL.screens.length}개 화면 · 인터랙션 시안`;
 document.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('active',x.dataset.mode===S.mode);x.setAttribute('aria-pressed',x.dataset.mode===S.mode);});
 $('#sidebar').innerHTML=Object.entries(RL.groups).map(([key,label])=>`<div class="side-label">${label}</div>${RL.screens.filter(x=>x.group===key).map(x=>`<button class="side-item ${S.current===x.id?'current':''}" data-go="${x.id}"><span class="sid">${x.id}</span>${x.title}</button>`).join('')}`).join('');
 $('#main').classList.toggle('full-content',S.full&&S.mode==='atlas');
 if(S.mode==='atlas'){
  const screens=RL.screens.filter(x=>S.filter==='all'||x.group===S.filter);
  $('#main').innerHTML=`<div class="intro"><div><div class="kicker">루틴로그 · 디자인 시스템 01</div><h2>매일 달라진 것만,<br>가볍게 남기세요.</h2><p>실버 · 차콜 · 딥 블루 · 은은한 연두<br>화면을 누르면 기록 흐름을 따라갈 수 있습니다.</p></div><span class="screen-badge">390 × 844</span></div>${flowButtons()}<div class="group-nav">${[['all','전체'],...Object.entries(RL.groups)].map(([k,t])=>`<button data-filter="${k}" class="${S.filter===k?'active':''}">${t} ${k==='all'?RL.screens.length:RL.screens.filter(s=>s.group===k).length}</button>`).join('')}</div><div class="row" style="margin-bottom:17px"><p class="small">${screens.length}개 화면 · 내부 스크롤 가능</p><button data-act="full" class="btn tiny">${S.full?'휴대폰 높이로 보기':'전체 내용 펼치기'}</button></div><div class="atlas-grid">${screens.map(sc=>`<section class="board"><div class="board-heading"><h3><span class="sid">${sc.id}</span> ${sc.title}</h3><button data-go="${sc.id}">확대 보기</button></div>${phone(sc)}<p class="board-caption">${sc.layout}</p></section>`).join('')}</div>`;
 }else{
  $('#main').innerHTML=`${flowButtons()}<div class="focus-layout"><div><div class="prototype-label"><span><i class="dot"></i> 인터랙션 시안 · ${active.id}</span><span>가상 기록</span></div>${phone(active)}</div><aside class="spec-panel"><div class="spec-id">${active.id} / ${RL.groups[active.group]}</div><h2>${active.title}</h2><div class="swatches" aria-label="디자인 색상">${['#edf0f3','#171a20','#2453bf','#b8d99a','#b93f3b'].map(c=>`<span class="swatch" style="background:${c}" title="${c}"></span>`).join('')}</div><h3>화면의 우선순위</h3><p>${active.layout}</p><h3>사용자 흐름</h3><p>${active.flow}</p><h3>내부 동작</h3><p>${active.logic}</p><div class="scope"><strong>디자인 검토용 프로토타입</strong><p>기록·선택·변경을 직접 눌러볼 수 있습니다. 로그인·OCR·걸음 수·AI는 샘플이며 새로고침하면 초기화됩니다.</p><div class="cols"><button class="btn tiny a11y-text-size" data-design-action="text" aria-pressed="${document.body.classList.contains('large-text')}">큰 글씨 ${document.body.classList.contains('large-text')?'켜짐':'보기'}</button><button class="btn tiny" data-design-action="motion" aria-pressed="${document.body.classList.contains('motion-off')}">모션 ${document.body.classList.contains('motion-off')?'끄기 적용':'줄이기'}</button></div></div><div class="cols section"><button data-prev="-1">이전 화면</button><button data-prev="1">다음 화면</button></div><div class="wide-links"><a href="DESIGN-REFERENCES.md">레퍼런스 · 적용 기준 ↗</a><button data-mode="atlas" class="btn ghost">전체 화면</button></div></aside></div>`;
 }
 enhanceMobileSelects();
 requiredLabels($('#main'));
 document.querySelectorAll('.mini-table').forEach(table=>{const labels=[...table.querySelectorAll('thead th')].map(el=>el.textContent);table.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>td.dataset.label=labels[i]||''));});
 document.title=`루틴로그 · ${S.mode==='atlas'?'전체 디자인':active.title}`;
 if(oldId&&S.mode==='focus'&&motionAllowed()){
  if(oldId!==S.current){const el=$('.phone');el.classList.add('is-entering');setTimeout(()=>el.classList.remove('is-entering'),270);}
  else{
   document.querySelectorAll('[data-number],.stepper input').forEach(el=>{const key=el.dataset.number||el.dataset.key;if(oldNumbers[key]&&oldNumbers[key]!==String(el.value??el.textContent))el.classList.add('number-change');});
   document.querySelectorAll('[data-segment]').forEach(el=>{const from=oldSegments[el.dataset.segment],to=+el.dataset.selectedIndex;if(Number.isFinite(from)&&from!==to)el.querySelector('.seg-indicator').animate([{transform:`translateX(${from*100}%)`},{transform:`translateX(${to*100}%)`}],{duration:200,easing:'cubic-bezier(.2,.7,.2,1)'});});
  }
 }
 playStepPreviewOnEntry(oldId);
 if(S.current==='W10'&&S.mode==='focus'&&!S.restDeadline)S.restDeadline=Date.now()+S.rest*1000;
 if(oldId&&oldId!==S.current&&S.mode==='focus')$('.app-head h2')?.focus({preventScroll:true});
 else if(focusSpec&&focusEl?.closest('.phone')){const nodes=[...document.querySelectorAll('.phone button,.phone input,.phone select')];const match=nodes.find(el=>Object.keys(focusSpec).length&&Object.entries(focusSpec).every(([k,v])=>el.dataset[k]===v));match?.focus({preventScroll:true});}
}
document.addEventListener('click',e=>{const act=e.target.closest('[data-design-action]')?.dataset.designAction;if(act==='text'){document.body.classList.toggle('large-text');rerender();}if(act==='motion'){document.body.classList.toggle('motion-off');rerender();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&['F04','R06'].includes(S.current)&&S.mode==='focus')go(findScreen(S.current).back);});
setInterval(()=>{if(!S.restDeadline)return;const remaining=Math.max(0,Math.ceil((S.restDeadline-Date.now())/1000));if(remaining===S.rest)return;S.rest=remaining;const el=document.querySelector('[data-number="rest-time"]');if(!el)return;el.textContent=timeText(S.rest);if(motionAllowed()){el.classList.remove('number-change');void el.offsetWidth;el.classList.add('number-change');}const arc=document.querySelector('.timer-dial svg circle:last-child');if(arc)arc.setAttribute('stroke-dashoffset',660*(1-Math.min(S.rest/90,1)));},250);
applyProductLayouts();
applyExperienceLayouts();
applyProgramLayouts();
applyCardioLayout();
applyMealSlotLayouts();
applyRecordingRefinements();
applyProductCopy();
render();
