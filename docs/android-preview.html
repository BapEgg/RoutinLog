<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루틴로그 · Android 화면</title>
<style>
@font-face{font-family:SUIT;src:url('../design-reference/assets/SUIT-Variable.woff2')}*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#171a20;font-family:SUIT,system-ui,sans-serif}header,main,footer{max-width:1300px;margin:auto;padding:28px}header{padding-top:54px}a{color:#2453bf}h1{font-size:36px;letter-spacing:-1px;margin:16px 0}p{line-height:1.7;color:#536170}.badge{display:inline-block;background:#242b35;color:#b8d99a;padding:8px 14px;border-radius:99px;font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;border:1px solid #c6cfd9;border-radius:12px;background:white;padding:12px 18px;min-height:48px;color:#171a20}button[aria-pressed=true]{background:#b8d99a}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.card h2{font-size:16px;font-weight:600}.card h2 span{color:#536170;font-size:12px;margin-right:8px}.shot{width:100%;display:block;border:1px solid #c6cfd9;border-radius:22px;box-shadow:0 12px 30px #171a200b}.open{display:block;border:0;background:transparent;padding:0;width:100%;text-align:left}.notice{border-left:3px solid #2453bf;padding:0 16px;margin-top:24px;font-size:14px}dialog{max-width:min(96vw,510px);padding:16px;border:1px solid #c6cfd9;border-radius:20px;background:#edf0f3}dialog::backdrop{background:#151a22bb}dialog img{max-width:100%;max-height:78vh;display:block;margin:auto;object-fit:contain}dialog .actions{display:flex;gap:8px;justify-content:space-between;margin-top:12px}button:focus-visible,a:focus-visible{outline:3px solid #2453bf;outline-offset:4px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}header,main,footer{padding:20px}h1{font-size:30px}}@media(max-width:420px){.grid{grid-template-columns:1fr} .card{max-width:320px;margin:auto;width:100%}}
</style></head><body><header><a href="index.html">← 프로젝트 안내</a><p><span class="badge">Kotlin · Jetpack Compose</span></p><h1>디자인을 실제 앱 화면으로.</h1><p>기존 67개 화면을 Android UI로 옮겼습니다.<br>아래 이미지는 에뮬레이터에서 실행한 앱을 직접 캡처한 화면입니다.</p><div class="notice">화면과 입력 흐름을 확인하는 단계입니다. 샘플 값은 메모리에만 있으며, Google 로그인·개인 기록 저장·걸음 연동·AI는 서버 연결 이후 제공됩니다.</div><div class="filters" id="filters" aria-label="화면 분류"></div><p id="count" aria-live="polite"></p></header><main><div class="grid" id="grid"></div></main><footer><p>Android 16 / API 36 · Pixel 5 에뮬레이터. 화면 안의 ‘화면 목록’은 개발용 탐색 메뉴입니다.</p><a href="../design-reference/index.html">기존 HTML 디자인과 비교하기 →</a></footer><dialog id="viewer" aria-label="화면 확대"><h2 id="viewerTitle"></h2><img id="viewerImage" alt=""><div class="actions"><button id="previous">이전</button><button id="close">닫기</button><button id="next">다음</button></div></dialog>
<script id="screens" type="application/json">[{"id":"A01","title":"내 루틴의 시작"},{"id":"A02","title":"시작하기 전 확인"},{"id":"A03","title":"어떤 방향으로 기록할까요?"},{"id":"A04","title":"신체 기준을 알려주세요"},{"id":"A05","title":"평소 하루는 어떤가요?"},{"id":"A06","title":"현재 운동과 가능한 일정"},{"id":"A07","title":"나에게 맞춘 시작 목표"},{"id":"A08","title":"걸음도 함께 기록할까요?"},{"id":"H01","title":"오늘"},{"id":"H02","title":"내 루틴을 만들어보세요"},{"id":"H03","title":"나의 기록 달력"},{"id":"H04","title":"체중·허리 기록"},{"id":"H05","title":"신체 기록"},{"id":"H06","title":"오늘 걸음"},{"id":"H07","title":"오늘의 컨디션"},{"id":"F01","title":"오늘의 식단"},{"id":"F02","title":"저장한 식단"},{"id":"F03","title":"식사 구성 확인"},{"id":"F04","title":"먹은 양 수정"},{"id":"F05","title":"다른 식사로 바꾸기"},{"id":"F06","title":"음식 찾기"},{"id":"F07","title":"식품 정보 확인"},{"id":"F08","title":"음식 등록 방법"},{"id":"F09","title":"영양성분표 촬영"},{"id":"F10","title":"읽은 내용 확인"},{"id":"F11","title":"상품 주소로 등록"},{"id":"F12","title":"상품 정보를 읽지 못했어요"},{"id":"F13","title":"식품 직접 등록"},{"id":"F14","title":"저장 식사·레시피 편집"},{"id":"F15","title":"식사 기록 저장"},{"id":"F16","title":"이름만 먼저 기록"},{"id":"W01","title":"일주일 운동"},{"id":"W02","title":"프로그램 찾기"},{"id":"W03","title":"프로그램 상세"},{"id":"W04","title":"내 루틴 편집"},{"id":"W05","title":"운동 추가"},{"id":"W06","title":"운동법·내 기록"},{"id":"W07","title":"내 운동 등록"},{"id":"W08","title":"오늘 하체 A"},{"id":"W09","title":"세트 기록"},{"id":"W10","title":"세트 사이 휴식"},{"id":"W11","title":"대체 운동 찾기"},{"id":"W12","title":"운동 교체 확인"},{"id":"W13","title":"불편함·수행 메모"},{"id":"W14","title":"운동 일정 옮기기"},{"id":"W15","title":"유산소 기록"},{"id":"W16","title":"오늘 운동 마무리"},{"id":"W17","title":"나의 워밍업·스트레칭"},{"id":"R01","title":"지난주, 나의 루틴"},{"id":"R02","title":"주간 영양 비교"},{"id":"R03","title":"주간 운동 비교"},{"id":"R04","title":"몸과 생활 활동"},{"id":"R05","title":"다음 주 제안"},{"id":"R06","title":"제안 직접 수정"},{"id":"R07","title":"적용 전 마지막 확인"},{"id":"R08","title":"이 제안의 근거"},{"id":"R09","title":"지난 리포트·내 선택"},{"id":"R10","title":"아직 비교할 기록이 적어요"},{"id":"R11","title":"다음 계획에 반영했어요"},{"id":"S01","title":"설정"},{"id":"S02","title":"프로필·목표·단위"},{"id":"S03","title":"걸음수·권한 관리"},{"id":"S04","title":"데이터·계정"},{"id":"S05","title":"알림 설정"},{"id":"S06","title":"계정 삭제 확인"},{"id":"E01","title":"네트워크 연결을 확인해주세요"},{"id":"E02","title":"수정 중인 내용"}]</script><script>
const screens=JSON.parse(document.getElementById('screens').textContent),groups={all:'전체',A:'시작',H:'오늘',F:'식단',W:'운동',R:'리포트',S:'설정',E:'연결·수정'},grid=document.getElementById('grid'),viewer=document.getElementById('viewer');let filter='all',current=0;
function show(i){current=(i+screens.length)%screens.length;const s=screens[current];document.getElementById('viewerTitle').textContent=s.id+' · '+s.title;const img=document.getElementById('viewerImage');img.src='assets/android/'+s.id+'.png';img.alt=s.title+' Android 화면';if(!viewer.open)viewer.showModal()}
function render(){grid.replaceChildren();document.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.group===filter)));const list=screens.filter(s=>filter==='all'||s.id[0]===filter);document.getElementById('count').textContent=list.length+'개 화면 · 눌러서 확대';list.forEach(s=>{const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=s.id+' · '+s.title;const b=document.createElement('button');b.className='open';b.setAttribute('aria-label',s.title+' 확대');b.onclick=()=>show(screens.indexOf(s));const img=document.createElement('img');img.className='shot';img.src='assets/android/'+s.id+'.png';img.alt=s.title;img.loading='lazy';b.append(img);card.append(h,b);grid.append(card)})}
for(const[k,v]of Object.entries(groups)){const b=document.createElement('button');b.dataset.group=k;b.textContent=v;b.onclick=()=>{filter=k;render()};document.getElementById('filters').append(b)}
document.getElementById('close').onclick=()=>viewer.close();document.getElementById('previous').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);viewer.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});render();
</script></body></html>
